<!DOCTYPE html>
<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@100;300;400;500;600;700;800;900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "primary-fixed": "#c3f400","surface-container-high": "#2a2a2a",
                    "surface": "#131313","background": "#131313",
            },
            "fontFamily": {
                    "label-sm": ["Lexend"],"headline-md": ["Lexend"],
                    "headline-lg": ["Lexend"],"body-md": ["Lexend"],
                    "label-bold": ["Lexend"],"display-xl": ["Lexend"],"body-lg": ["Lexend"]
            }
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            display: inline-block;
            line-height: 1;
            text-transform: none;
        }
        body { background-color: #131313; color: #e5e2e1; font-family: 'Lexend', sans-serif; min-height: max(884px, 100dvh); }
        .kinetic-glow { box-shadow: 0px 10px 30px rgba(204, 255, 0, 0.15); }
    </style>
  </head>
<body class="min-h-screen pb-32">
<header class="fixed top-0 left-0 right-0 z-50 flex justify-between items-center px-4 h-16 bg-zinc-900/80 backdrop-blur-xl rounded-2xl mt-4 mx-5 border border-white/10 shadow-[0px_10px_30px_rgba(204,255,0,0.15)]">
<div class="flex items-center gap-3">
<button class="hover:scale-105 transition-transform duration-200 active:scale-95 transition-all text-lime-400">
<span class="material-symbols-outlined" data-icon="menu">menu</span>
</button>
<h1 class="text-xl font-black text-lime-400 font-lexend tracking-tighter uppercase">KINETIC</h1>
</div>
<div class="flex items-center gap-4">
<button class="text-zinc-500"><span class="material-symbols-outlined" data-icon="notifications">notifications</span></button>
<div class="w-8 h-8 rounded-full overflow-hidden border border-lime-400/30">
<img alt="Trainer" class="w-full h-full object-cover profile-pic" src="https://images.unsplash.com/photo-1544367567-0f2fcb009e0b?q=80&w=1520&auto=format&fit=crop"/>
</div>
</div>
</header>
<main class="pt-28 px-5 space-y-6 max-w-2xl mx-auto">
<div class="flex flex-col gap-1">
<p class="text-xs text-lime-400 uppercase tracking-[0.2em]">Training Schedule</p>
<h2 class="text-3xl font-bold text-white">October 2023</h2>
</div>

<!-- Calendar Matrix omitted for brevity, dynamic list injected here -->
<section class="space-y-4">
    <h3 class="text-2xl font-bold text-white">Next Session</h3>
    <div class="bg-[#1A1A1A] rounded-[24px] overflow-hidden shadow-2xl border border-white/5 group hover:border-lime-400/30 transition-colors duration-300">
        <div class="p-6 space-y-4">
            <div class="flex justify-between items-start">
            <div>
                <h4 id="next-session-title" class="text-xl font-bold text-white">--</h4>
            </div>
            <div class="text-right">
                <p id="next-session-time" class="text-3xl font-bold text-lime-400 leading-none">--</p>
            </div>
            </div>
        </div>
    </div>
</section>

<section class="space-y-4 mt-8">
    <h3 class="text-2xl font-bold text-white">Upcoming Classes</h3>
    <div id="classesList" class="flex flex-col gap-4">
        <p class="text-zinc-500">Loading schedules...</p>
    </div>
</section>
</main>
<nav class="fixed bottom-0 left-0 right-0 z-50 flex justify-around items-center h-20 px-6 bg-zinc-900/90 backdrop-blur-2xl rounded-full mb-8 mx-10 border border-white/5 shadow-[0px_20px_50px_rgba(0,0,0,0.5)]">
<button class="text-zinc-500 p-3 hover:text-lime-400 transition-colors active:scale-90" onclick="window.location.href='app-feed.html'"><span class="material-symbols-outlined">home</span></button>
<button class="text-zinc-500 p-3 hover:text-lime-400 transition-colors active:scale-90" onclick="window.location.href='app-messages.html'"><span class="material-symbols-outlined">chat</span></button>
<button class="bg-lime-400 text-black rounded-full p-3 shadow-[0_0_20px_rgba(204,255,0,0.6)] active:scale-90"><span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">event_note</span></button>
<button class="text-zinc-500 p-3 hover:text-lime-400 transition-colors active:scale-90" onclick="window.location.href='app-tasks.html'"><span class="material-symbols-outlined">crisis_alert</span></button>
</nav>

<script>
    const token = localStorage.getItem('token');
    if (!token) window.location.href = 'login.html';
    const user = JSON.parse(localStorage.getItem('user') || '{}');
    if(user.profile_pic) document.querySelector('.profile-pic').src = user.profile_pic;

    async function loadBookings() {
        try {
            const classRes = await fetch('/api/classes', { headers: { 'Authorization': `Bearer ${token}` } });
            const classData = await classRes.json();
            
            const res = await fetch('/api/bookings', {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            const json = await res.json();
            const bookings = json.bookings || [];
            if (bookings.length > 0) {
                const first = bookings[0];
                document.getElementById('next-session-title').innerText = first.class_name;
                document.getElementById('next-session-time').innerText = new Date(first.time).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
            } else {
                document.getElementById('next-session-title').innerText = "No upcoming sessions";
                document.getElementById('next-session-time').innerText = "--";
            }

            const activeBookingIds = bookings.map(b => b.class_id);

            const container = document.getElementById('classesList');
            if (classData.classes && classData.classes.length > 0) {
                container.innerHTML = classData.classes.map(c => {
                    const isBooked = activeBookingIds.includes(c.id);
                    return `
                    <div class="bg-[#1A1A1A] rounded-[24px] p-6 shadow-xl border border-white/5 flex flex-col gap-4">
                        <div class="flex justify-between items-start">
                            <h4 class="font-bold text-white text-xl uppercase tracking-tighter">${c.name}</h4>
                            <span class="text-sm text-lime-400 font-bold bg-lime-400/10 px-3 py-1 rounded-full">${new Date(c.time).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</span>
                        </div>
                        <p class="text-sm text-zinc-400">Coach ${c.instructor} • ${c.location}</p>
                        <button onclick="enrollClass(${c.id}, ${isBooked})" class="w-full py-4 rounded-xl font-bold text-sm uppercase tracking-widest transition-all shadow-lg ${isBooked ? 'bg-[#333] text-zinc-500 cursor-not-allowed border border-white/5' : 'bg-lime-400 text-black active:scale-95 hover:bg-lime-300 kinetic-glow'}">
                            ${isBooked ? 'SPOT RESERVED' : 'RESERVE SPOT'}
                        </button>
                    </div>`;
                }).join('');
            } else {
                container.innerHTML = `<p class="text-zinc-500">No classes scheduled.</p>`;
            }
        } catch (err) {
            console.error(err);
        }
    }
    
    window.enrollClass = async function(id, isBooked) {
        if (isBooked) return;
        try {
            const res = await fetch('/api/bookings', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                body: JSON.stringify({ class_id: id })
            });
            if (res.ok) {
                loadBookings();
            } else {
                alert('Booking failed.');
            }
        } catch(e) {
            alert('Network error.');
        }
    };

    document.addEventListener('DOMContentLoaded', loadBookings);
</script>
</body></html>
