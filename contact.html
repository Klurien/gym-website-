<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Intel | COMRADES GYM</title>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600;800&family=Syncopate:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>

<body class="subpage">
    <nav class="navbar scrolled">
        <div class="nav-container">
            <a href="index.html" class="logo"><span class="logo-red">COMRADES</span> GYM</a>
            <div class="nav-links">
                <a href="index.html" class="nav-link">HOME</a>
                <a href="services.html" class="nav-link">SERVICES</a>
                <a href="login.html" class="nav-link">LOGIN</a>
            </div>
        </div>
    </nav>

    <section class="container" style="padding: 15rem 0;">
        <div class="about-grid">
            <div class="contact-info-panel">
                <div class="section-badge">COMMUNICATIONS</div>
                <h1 class="section-title">SEND AN <span class="logo-red">ENVOY.</span></h1>
                <p class="section-description">Ready to join the ranks? Our recruitment team is standing by to prepare your transformation.</p>
                
                <div class="benefit-item" style="margin-top: 3rem; background: var(--color-surface-solid);">
                    <div style="display: flex; gap: 1.5rem; flex-direction: column;">
                        <div>
                            <h4 class="logo-red">HEADQUARTERS</h4>
                            <p>RXX9+G3 Ruiru Town, Kenya</p>
                        </div>
                        <div>
                            <h4 class="logo-red">HOTLINE</h4>
                            <p>+254 726 619421</p>
                        </div>
                        <div>
                            <h4 class="logo-red">SECURE EMAIL</h4>
                            <p>intel@comradesgym.ke</p>
                        </div>
                    </div>
                </div>
            </div>

            <div class="contact-form-wrapper">
                <form id="contactForm" class="benefit-item" style="padding: 4rem;">
                    <div style="display: grid; gap: 2rem;">
                        <input type="text" name="name" placeholder="FULL NAME" required style="width: 100%; padding: 1.2rem; background: rgba(255,255,255,0.05); border: 1px solid var(--color-border); color: #fff; font-family: var(--font-body);">
                        <input type="email" name="email" placeholder="EMAIL ADDRESS" required style="width: 100%; padding: 1.2rem; background: rgba(255,255,255,0.05); border: 1px solid var(--color-border); color: #fff; font-family: var(--font-body);">
                        <select name="interests" required style="width: 100%; padding: 1.2rem; background: rgba(255,255,255,0.05); border: 1px solid var(--color-border); color: #fff; font-family: var(--font-body);">
                            <option value="" disabled selected>SELECT BATTLEFIELD</option>
                            <option value="STRENGTH">TITAN STRENGTH</option>
                            <option value="AEROBICS">AERO-BLAST</option>
                            <option value="BOXING">BOXING</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="message">GOALS & MESSAGE</label>
                        <textarea id="message" name="message" rows="4" placeholder="Tell us about your fitness goals..."></textarea>
                    </div>
                    
                    <button type="submit" class="btn-primary" style="width: 100%;">SEND INFORMATION</button>
                    
                    <div id="statusMsg" class="status-msg"></div>
                </form>
            </div>
        </div>
    </section>

    <script>
        // Pre-select interest if passed in URL
        const urlParams = new URLSearchParams(window.location.search);
        const interest = urlParams.get('interest');
        if (interest) {
            document.getElementById('interests').value = interest;
        }

        const form = document.getElementById('clientForm');
        const statusMsg = document.getElementById('statusMsg');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = {
                name: form.name.value,
                email: form.email.value,
                phone: form.phone.value,
                interests: form.interests.value,
                message: form.message.value
            };

            statusMsg.textContent = "Sending information...";
            statusMsg.className = "status-msg";
            statusMsg.style.display = "block";

            try {
                // Pointing to absolute URL for local/prod compatibility or relative if hosted together
                const response = await fetch('/api/contact', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(formData)
                });

                if (response.ok) {
                    statusMsg.textContent = "Success! Your information has been stored in TiDB. We will contact you soon.";
                    statusMsg.classList.add('success');
                    form.reset();
                } else {
                    statusMsg.textContent = "Failed to send. Please try again or call us directly.";
                    statusMsg.classList.add('error');
                }
            } catch (err) {
                console.error(err);
                statusMsg.textContent = "Error connecting to server. Make sure the backend is running.";
                statusMsg.classList.add('error');
            }
        });
    </script>
</body>
</html>
