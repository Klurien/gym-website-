<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact & Join | Comrades Gym</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600;800&family=Syncopate:wght@700&display=swap" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>

<body class="subpage">
    <!-- Navigation -->
    <nav class="navbar scrolled" id="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo">
                <span class="logo-red">COMRADES</span> GYM
            </a>
            <div class="nav-links">
                <a href="index.html" class="nav-link">HOME</a>
                <a href="about.html" class="nav-link">ABOUT</a>
                <a href="contact.html" class="nav-link active">CONTACT</a>
            </div>
        </div>
    </nav>

    <section class="contact-section">
        <div class="container contact-grid">
            <div class="contact-info">
                <div class="section-badge">JOIN THE ELITE</div>
                <h1 class="section-title">START YOUR <span class="text-red">TRANSFORMATION.</span></h1>
                <p class="section-description">
                    Fill out the form below with your contact details and fitness interests. A Comrades Trainer will reach out to you within 24 hours to discuss your plan.
                </p>
                
                <ul class="contact-list" style="margin-top: 3rem;">
                    <li><i class="fa-solid fa-location-dot text-red"></i> Ruiru Town, CBD</li>
                    <li><i class="fa-solid fa-phone text-red"></i> 0726 619421</li>
                    <li><i class="fa-solid fa-envelope text-red"></i> trainers@comradesgym.ke</li>
                </ul>
            </div>

            <div class="contact-form">
                <form id="clientForm">
                    <div class="form-group">
                        <label for="name">FULL NAME</label>
                        <input type="text" id="name" name="name" placeholder="John Doe" required>
                    </div>
                    <div class="form-group">
                        <label for="email">EMAIL ADDRESS</label>
                        <input type="email" id="email" name="email" placeholder="john@example.com" required>
                    </div>
                    <div class="form-group">
                        <label for="phone">PHONE NUMBER</label>
                        <input type="tel" id="phone" name="phone" placeholder="+254 7XX XXX XXX">
                    </div>
                    <div class="form-group">
                        <label for="interests">PRIMARY INTEREST</label>
                        <select id="interests" name="interests">
                            <option value="strength">Strength Training</option>
                            <option value="aerobics">Aerobics / Cardio</option>
                            <option value="zumba">Zumba / Dance</option>
                            <option value="boxing">Boxing</option>
                            <option value="general">General Fitness</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="message">GOALS & MESSAGE</label>
                        <textarea id="message" name="message" rows="4" placeholder="Tell us about your fitness goals..."></textarea>
                    </div>
                    
                    <button type="submit" class="btn-primary" style="width: 100%;">SEND INFORMATION</button>
                    
                    <div id="statusMsg" class="status-msg"></div>
                </form>
            </div>
        </div>
    </section>

    <script>
        // Pre-select interest if passed in URL
        const urlParams = new URLSearchParams(window.location.search);
        const interest = urlParams.get('interest');
        if (interest) {
            document.getElementById('interests').value = interest;
        }

        const form = document.getElementById('clientForm');
        const statusMsg = document.getElementById('statusMsg');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = {
                name: form.name.value,
                email: form.email.value,
                phone: form.phone.value,
                interests: form.interests.value,
                message: form.message.value
            };

            statusMsg.textContent = "Sending information...";
            statusMsg.className = "status-msg";
            statusMsg.style.display = "block";

            try {
                // Pointing to absolute URL for local/prod compatibility or relative if hosted together
                const response = await fetch('/api/contact', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(formData)
                });

                if (response.ok) {
                    statusMsg.textContent = "Success! Your information has been stored in TiDB. We will contact you soon.";
                    statusMsg.classList.add('success');
                    form.reset();
                } else {
                    statusMsg.textContent = "Failed to send. Please try again or call us directly.";
                    statusMsg.classList.add('error');
                }
            } catch (err) {
                console.error(err);
                statusMsg.textContent = "Error connecting to server. Make sure the backend is running.";
                statusMsg.classList.add('error');
            }
        });
    </script>
</body>
</html>
