                        "on-secondary-fixed": "#1c1b1b",
                        "inverse-primary": "#506600",
                        "primary-container": "#c3f400",
                        "inverse-surface": "#e5e2e1",

                        "tertiary-fixed-dim": "#2de500",

<body class="bg-background text-on-background min-h-screen">
<!-- TopAppBar -->
<header class="fixed top-0 left-0 right-0 z-50 flex justify-between items-center px-4 h-16 bg-zinc-900/80 backdrop-blur-xl rounded-2xl mt-4 mx-5 border border-white/10 shadow-[0px_10px_30px_rgba(204,255,0,0.15)]">
<div class="flex items-center gap-3">
<button class="text-lime-400 hover:scale-105 transition-transform duration-200 active:scale-95 transition-all">
<span class="material-symbols-outlined">menu</span>
</button>
<h1 class="font-lexend font-black tracking-tighter uppercase text-xl text-lime-400">KINETIC</h1>
</div>
<div class="flex items-center gap-4">
<button class="text-zinc-500 hover:scale-105 transition-transform duration-200 active:scale-95 transition-all">
<span class="material-symbols-outlined">notifications</span>
</button>
<div class="w-8 h-8 rounded-full border border-lime-400/30 overflow-hidden">
<img alt="Profile" class="w-full h-full object-cover profile-pic" data-alt="Close-up portrait of a professional athletic trainer with a determined expression in a dark high-tech gym setting" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAW2Q0nBfn9Xx07pbIRfAc6Ghl9JwIrIJ53Gldh6ksdrpN0N8-jqzdazo_PCtQUytNT8Qacot3ON9SEPxKjzDwWxw7tfdPxP5eZXo4edUa0wVSpIWkIvOepsv1POU73Xar1LOG1iWAmNgG7qtlUFKLeTVMg3-zQ_WU_dMktXYKLlJOSt12xO5T0tUrgBT-nRuKgvdi67ylJ8cJbk4x-8gME8dMb5iYwVGyyaytejGrEqrH5g_LJmFsAwSBzoZcJen3EivlatL0tyHcM"/>
</div>
</div>
</header>
<main class="pt-28 pb-32 px-edge-margin space-y-stack-lg max-w-5xl mx-auto">
<!-- Header Section -->
<section class="flex flex-col gap-2">
<h2 class="font-display-xl text-display-xl text-primary tracking-tighter">DAILY TASKS</h2>
<div class="flex items-center gap-3">
<div class="h-1 flex-1 bg-zinc-800 rounded-full overflow-hidden">
<div class="h-full bg-gradient-to-r from-lime-500 to-lime-300 w-[65%]"></div>
</div>
<span class="font-label-bold text-label-bold text-lime-400">65% DONE</span>
</div>
</section>
<!-- Bento Grid Tasks -->
<section class="grid grid-cols-1 md:grid-cols-2 gap-gutter" id="workoutsDataArea">

</section>
<!-- Active Checklist -->
<div class="md:col-span-2 bg-zinc-900/50 rounded-[24px] border border-white/5 overflow-hidden mt-8">
<div class="p-container-padding border-b border-white/5 flex justify-between items-center">
<h3 class="font-headline-md text-headline-md text-primary uppercase">Active Checklist</h3>
<span class="material-symbols-outlined text-zinc-500">more_horiz</span>
</div>
<div class="divide-y divide-white/5">
<div class="p-4 flex items-center gap-4 hover:bg-white/5 transition-colors cursor-pointer group">
<div class="w-6 h-6 rounded border-2 border-lime-400/50 flex items-center justify-center group-hover:bg-lime-400/10 transition-all">
<span class="material-symbols-outlined text-lime-400 text-sm hidden group-hover:block">check</span>
</div>
<span class="font-body-md text-body-md flex-1">Morning Mobility Flow</span>
<span class="font-label-sm text-label-sm text-zinc-500">08:00 AM</span>
</div>
</div>
</div>
</section>
<!-- Stats Overview -->
<section class="grid grid-cols-2 md:grid-cols-4 gap-gutter mt-8">
<div class="bg-zinc-900/50 p-stack-md rounded-[20px] border border-white/5 text-center">
<p class="font-label-sm text-label-sm text-zinc-500 uppercase">Streak</p>
<p class="font-display-xl text-[32px] text-lime-400">12</p>
</div>
<div class="bg-zinc-900/50 p-stack-md rounded-[20px] border border-white/5 text-center">
<p class="font-label-sm text-label-sm text-zinc-500 uppercase">Distance</p>
<p class="font-display-xl text-[32px] text-white" id="stat-dist">0km</p>
</div>
<div class="bg-zinc-900/50 p-stack-md rounded-[20px] border border-white/5 text-center">
<p class="font-label-sm text-label-sm text-zinc-500 uppercase">Calories</p>
<p class="font-display-xl text-[32px] text-white" id="stat-cals">0k</p>
</div>
<div class="bg-zinc-900/50 p-stack-md rounded-[20px] border border-white/5 text-center">
<p class="font-label-sm text-label-sm text-zinc-500 uppercase">Sleep</p>
<p class="font-display-xl text-[32px] text-white">7h</p>
</div>
</section>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 right-0 z-50 flex justify-around items-center h-20 px-6 bg-zinc-900/90 backdrop-blur-2xl rounded-full mb-8 mx-10 border border-white/5 shadow-[0px_20px_50px_rgba(0,0,0,0.5)]">
<a class="text-zinc-500 p-3 hover:text-lime-400 transition-colors active:scale-90 duration-150" href="app-feed.html">
<span class="material-symbols-outlined">home</span>
</a>
<a class="text-zinc-500 p-3 hover:text-lime-400 transition-colors active:scale-90 duration-150" href="app-messages.html">
<span class="material-symbols-outlined">chat</span>
</a>
<a class="text-zinc-500 p-3 hover:text-lime-400 transition-colors active:scale-90 duration-150" href="app-calendar.html">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">event_note</span>
</a>
<a class="bg-lime-400 text-black rounded-full p-3 shadow-[0_0_20px_rgba(204,255,0,0.6)] active:scale-90 duration-150" href="app-tasks.html">
<span class="material-symbols-outlined">crisis_alert</span>
</a>
</nav>

<script>
    const token = localStorage.getItem('token');
    if (!token) window.location.href = 'login.html';
    const user = JSON.parse(localStorage.getItem('user') || '{}');
    if(user.profile_pic) document.querySelector('.profile-pic').src = user.profile_pic;

    async function loadWorkouts() {
        try {
            const res = await fetch('/api/workouts', {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            if (res.ok) {
                const json = await res.json();
                const workouts = json.workouts || [];
                let totalDist = 0; let totalCals = 0;
                
                const container = document.getElementById('workoutsDataArea');
                
                if (workouts.length === 0) {
                    container.innerHTML = '<p class="text-zinc-400 col-span-2">No active tasks today.</p>';
                } else {
                    container.innerHTML = workouts.map(w => {
                        totalDist += (w.distance || 0); totalCals += (w.calories_burned || 0);
                        return `
                        <div class="bg-zinc-900/50 p-container-padding rounded-[24px] border border-white/5 shadow-2xl relative overflow-hidden group hover:border-lime-400/50 transition-all duration-300">
                            <div class="flex justify-between items-start mb-4">
                                <div>
                                    <span class="bg-lime-400/10 text-lime-400 text-[10px] font-black px-2 py-1 rounded-full border border-lime-400/20 uppercase tracking-widest">${w.metric_type || 'Training'}</span>
                                    <h3 class="font-headline-md text-headline-md text-primary mt-2 uppercase">${w.name || 'Workout'}</h3>
                                </div>
                                <div class="w-12 h-12 rounded-xl bg-lime-400 flex items-center justify-center shadow-[0_0_20px_rgba(204,255,0,0.4)]">
                                    <span class="material-symbols-outlined text-black font-bold">fitness_center</span>
                                </div>
                            </div>
                            <p class="font-body-md text-body-md text-zinc-400 mb-6">Duration: ${w.duration}m | Calories: ${w.calories_burned}</p>
                            <div class="flex items-center justify-between">
                                <button class="bg-lime-400 text-black font-label-bold text-label-bold px-6 py-2 rounded-full hover:scale-105 active:scale-95 transition-all">COMPLETE</button>
                            </div>
                        </div>
                        `;
                    }).join('');
                }

                document.getElementById('stat-dist').innerText = totalDist.toFixed(1) + 'km';
                document.getElementById('stat-cals').innerText = (totalCals > 999 ? (totalCals/1000).toFixed(1) + 'k' : totalCals);
            }
        } catch (err) {
            console.error(err);
        }
    }
    document.addEventListener('DOMContentLoaded', loadWorkouts);
</script>
</body></html>
