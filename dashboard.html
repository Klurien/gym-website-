<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Member Dashboard | Comrades Gym</title>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600;800&family=Syncopate:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>

<body class="subpage">
    <nav class="navbar scrolled">
        <div class="nav-container">
            <a href="index.html" class="logo"><span class="logo-red">COMRADES</span> GYM</a>
            <div class="nav-links">
                <a href="#" id="logoutBtn" class="nav-link">LOGOUT</a>
            </div>
        </div>
    </nav>

    <section style="padding: 15rem 2rem;">
        <div class="container" style="display: grid; grid-template-columns: 1fr 1fr; gap: 4rem;">
            <!-- Left: Greeting and Profile -->
            <div class="about-text">
                <div class="section-badge">MEMBER PORTAL</div>
                <h1 class="service-name">WELCOME <span class="text-red" id="userName">COMRADE.</span></h1>
                <p class="section-description">
                    Stay focused on your transformation. We're tracking your path to excellence. Member status: <span class="text-red">ACTIVE</span>.
                </p>
                <div class="stats-grid" style="margin-top: 2rem;">
                    <div class="stat-card">
                        <h3 class="stat-number">1k+</h3>
                        <p class="stat-label">REP PROGRESS</p>
                    </div>
                    <div class="stat-card">
                        <h3 class="stat-number">2026</h3>
                        <p class="stat-label">MEMBER YEAR</p>
                    </div>
                </div>
            </div>

            <!-- Right: Creative Gym ID Card -->
            <div class="benefit-item" style="padding: 3rem; border-radius: 20px; border: 1px solid var(--color-border); background: linear-gradient(135deg, #111 0%, #000 100%); position: relative; overflow: hidden;">
                <div style="position: absolute; top: -50px; right: -50px; font-size: 15rem; color: rgba(255, 0, 0, 0.05); z-index: 0; font-family: 'Anton';">CG</div>
                <div style="position: relative; z-index: 1;">
                    <div style="display: flex; align-items: center; gap: 1.5rem; margin-bottom: 2rem;">
                        <div style="width: 80px; height: 80px; border-radius: 50%; border: 3px solid var(--color-red); background: url('https://lh3.googleusercontent.com/p/AF1QipN7yFxYsLSbfZEs9CjUQ1uxyQJU37yumhFiMoyC=s680-w680-h510') center/cover;"></div>
                        <div>
                            <h4 id="fullName" style="margin: 0;">USERNAME</h4>
                            <p style="font-size: 0.7rem; color: var(--color-text-muted);">MEMBER ID: #000456</p>
                        </div>
                    </div>
                    <div style="display: flex; flex-direction: column; gap: 1rem;">
                        <p><i class="fa-solid fa-trophy text-red"></i> Elite Rank: <span class="text-red">TITAN</span></p>
                        <p><i class="fa-solid fa-fire text-red"></i> Current Streak: <span class="text-red">24 DAYS</span></p>
                        <p><i class="fa-solid fa-dumbbell text-red"></i> Primary Focus: <span class="text-red">STRENGTH</span></p>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <script>
        // Auth Defense
        const token = localStorage.getItem('token');
        const user = JSON.parse(localStorage.getItem('user'));
        
        if (!token || !user) {
            window.location.href = 'login.html';
        }

        document.getElementById('userName').innerText = user.username.toUpperCase() + '.';
        document.getElementById('fullName').innerText = user.username.toUpperCase();

        document.getElementById('logoutBtn').addEventListener('click', (e) => {
            e.preventDefault();
            localStorage.clear();
            window.location.href = 'login.html';
        });
    </script>
</body>
</html>
