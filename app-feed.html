<!DOCTYPE html>
<html class="dark" lang="en"><head>
<meta charset="utf-8"/>

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>

        .glass-card {

            backdrop-filter: blur(12px);
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "background": "#131313",
                      "on-background": "#e5e2e1",
                      "surface": "#131313",
                      "on-surface": "#e5e2e1",
                      "primary": "#ffffff",
                      "primary-fixed": "#c3f400"
              },
              "borderRadius": {"DEFAULT": "0.25rem","lg": "0.5rem","xl": "0.75rem","full": "9999px"},
              "spacing": {"stack-md": "16px","gutter": "16px","edge-margin": "20px","unit": "4px","container-padding": "24px","stack-lg": "32px","stack-sm": "8px"},
              "fontFamily": {
                      "label-sm": ["Lexend"], "headline-md": ["Lexend"], "headline-lg": ["Lexend"], "body-md": ["Lexend"], "label-bold": ["Lexend"], "display-xl": ["Lexend"], "body-lg": ["Lexend"]
              },
              "fontSize": {
                      "label-sm": ["12px", {"lineHeight": "1.2", "fontWeight": "500"}],
                      "headline-md": ["24px", {"lineHeight": "1.3", "fontWeight": "600"}],
                      "headline-lg": ["32px", {"lineHeight": "1.2", "letterSpacing": "-0.01em", "fontWeight": "700"}],
                      "body-md": ["16px", {"lineHeight": "1.5", "fontWeight": "400"}],
                      "label-bold": ["14px", {"lineHeight": "1.2", "fontWeight": "700"}],
                      "display-xl": ["48px", {"lineHeight": "1.1", "letterSpacing": "-0.02em", "fontWeight": "800"}],
                      "body-lg": ["18px", {"lineHeight": "1.6", "fontWeight": "400"}]
              }
            },
          },
        }
    </script>
  </head>
<body class="bg-background text-on-background min-h-screen pb-32">
<!-- TopAppBar -->
<header class="fixed top-0 left-0 right-0 z-50 flex justify-between items-center px-4 h-16 bg-zinc-900/80 backdrop-blur-xl rounded-2xl mt-4 mx-5 border border-white/10 shadow-[0px_10px_30px_rgba(204,255,0,0.15)]">
<div class="flex items-center gap-4">
<button class="p-2 text-zinc-500 hover:scale-105 active:scale-95 transition-all">

<h1 class="text-xl font-black text-lime-400 font-lexend tracking-tighter uppercase">KINETIC</h1>
</div>
<div class="flex items-center gap-2">
<button class="p-2 text-zinc-500 hover:scale-105 active:scale-95 transition-all">
<span class="material-symbols-outlined" data-icon="notifications">notifications</span>
</button>
<div class="w-10 h-10 rounded-full border-2 border-lime-400 p-0.5 overflow-hidden">
<img alt="Alex Rivers" class="w-full h-full object-cover rounded-full" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAe2e9c3Yveyt8CGXNhLeNd-5GgPeKT87A-h3rsDcbvRHkLLkPUX0m7HXRCD1Py5clnNkTXK_yOegXbBxk8rjNEFAS_CqiK1Wtwa1XBi8lwOp6XMoHPudpC9qNf_d5kkCtexV7iilVEwa5dSonIHuUZ6_9FfeeTfH4AUIqADI2GfGqu4-X00YvBpE4HV0GHbHMwuQih5Ke8tmqYr8Gij2wYOz7TNo4EiHEZjl3hKVWAGa-BaEf1GYFlungW3LryWulRS2dLZBVHZSI_"/>
</div>
</div>
</header>
<!-- Main Content Canvas -->
<main class="mt-28 px-edge-margin space-y-gutter max-w-2xl mx-auto">
<!-- Stories/Quick Access Bento (Custom Extension) -->
<div class="grid grid-cols-4 gap-stack-md h-24 mb-stack-lg">
<div class="col-span-1 bg-zinc-900/40 rounded-2xl border border-white/5 flex flex-col items-center justify-center gap-1 hover:border-lime-400/50 transition-colors">
<div class="w-12 h-12 rounded-full border-2 border-dashed border-zinc-700 flex items-center justify-center">
<span class="material-symbols-outlined text-zinc-400" data-icon="add">add</span>
</div>
<span class="font-label-sm text-label-sm text-zinc-500">Post</span>
</div>
<div class="col-span-3 bg-zinc-900/40 rounded-2xl border border-white/5 overflow-hidden relative group">
<img class="absolute inset-0 w-full h-full object-cover opacity-40 group-hover:scale-110 transition-transform duration-700" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBSEjHP7QrRZn36afYXkYWwhYMzgsOeYHS1skaXUClEJrCEBYSXYPrCqtDIpKrZ7zQImqCZdnx2if-obOliXGrFkS-IhxiezKagtuXvacy978-LeN5yPBQe7EEbbsgd6H260sALF_bxu2HZMawJHmBZeHBUF-C3bTwHqd191HTZ9aus5dwyDHchV28CuBKMfY59RJ_oezS06FSoRbqb45me7-nWyy7nmFBJAxU196YIy1bvBirwGVLMRrEa2SZac5fXpi-DDtqdADiY"/>
<div class="absolute inset-0 bg-gradient-to-t from-black/80 to-transparent"></div>
<div class="absolute bottom-3 left-4">
<p class="font-label-bold text-label-bold text-lime-400">Live Workout</p>
<p class="font-label-sm text-label-sm text-white">Join Alex in 5 mins</p>
</div>
</div>
</div>
<div id="postsArea" class="space-y-gutter">
    <!-- Static prototypes removed, dynamic elements populated by script below -->
</div>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 right-0 z-50 flex justify-around items-center h-20 px-6 bg-zinc-900/90 backdrop-blur-2xl rounded-full mb-8 mx-10 border border-white/5 shadow-[0px_20px_50px_rgba(0,0,0,0.5)]">
<a class="bg-lime-400 text-black rounded-full p-3 shadow-[0_0_20px_rgba(204,255,0,0.6)] active:scale-90 duration-150 transition-all" href="app-feed.html">
<span class="material-symbols-outlined" data-icon="home" data-weight="fill">home</span>
</a>
<a class="text-zinc-500 p-3 hover:text-lime-400 transition-colors active:scale-90 duration-150" href="app-messages.html">
<span class="material-symbols-outlined" data-icon="chat">chat</span>
</a>
<a class="text-zinc-500 p-3 hover:text-lime-400 transition-colors active:scale-90 duration-150" href="app-calendar.html">
<span class="material-symbols-outlined" data-icon="event_note">event_note</span>
</a>
<a class="text-zinc-500 p-3 hover:text-lime-400 transition-colors active:scale-90 duration-150" href="app-tasks.html">
<span class="material-symbols-outlined" data-icon="crisis_alert">crisis_alert</span>
</a>
</nav>
<!-- Floating Action Button Contextual Check: Primary Dashboard/Home context, FAB included -->
<button class="fixed bottom-32 right-8 w-14 h-14 bg-lime-400 text-black rounded-2xl shadow-[0_0_30px_rgba(204,255,0,0.4)] flex items-center justify-center hover:scale-110 active:scale-95 transition-all z-40">
<span class="material-symbols-outlined text-3xl" data-icon="add">add</span>
</button>
<script>
    const token = localStorage.getItem('token');
    if (!token) window.location.href = '/auth';
    
    // Original Static Image for Trainer: https://lh3.googleusercontent.com/aida-public/AB6AXuAa2yTUoLjx...
    // Original Static Video for Trainer: https://lh3.googleusercontent.com/aida-public/AB6AXuAL1xpKjmfS2V2zax9_z8W...
    
    async function fetchPosts() {
        try {
            const response = await fetch('/api/posts', { headers: { 'Authorization': 'Bearer ' + token } });
            const posts = await response.json();
            const container = document.getElementById('postsArea');
            if (!posts || posts.length === 0) return;
            
            container.innerHTML = posts.map(post => {
                if(post.type === 'live') {
                    return `
                    <article class="bg-zinc-900/60 rounded-[24px] overflow-hidden border border-white/5 shadow-2xl relative group cursor-pointer" onclick="window.location.href='app-live.html?id=${post.id}'">
                        <div class="p-container-padding flex items-center justify-between">
                            <div class="flex items-center gap-3">
                                <img class="w-10 h-10 rounded-full border border-zinc-700" src="https://lh3.googleusercontent.com/aida-public/AB6AXuD3xo0lYbpDsRF7OZaGQrBuHc1_hKf6NPKMTb1EkeR0OFb0rnw1QEVQbpwCHfyeKIMXSfeQsPdt2H3Jpc6p77awatXreqlLzl14zZiXnROuQY-Ht0pjpj8rK_vYiJS1yU9K17Os9kIw8NcOE-aqeIh6iwWPe0Pjqig8FQBegnUGTohfjImbikNX3shj28ink8jbuziTj3GkCFdiDoeVxTRBwA7JIBWpQxm_cCFuKwuUP2CODlAKqwSndjvNMOHrrcPtFoKdr3u3TIKm"/>
                                <div>
                                    <h3 class="font-label-bold text-label-bold text-on-surface">${post.trainer_name || 'Coach'}</h3>
                                    <p class="font-label-sm text-label-sm text-zinc-500">Pro Coach • ${new Date(post.created_at).toLocaleDateString()}</p>
                                </div>
                            </div>
                            <button class="text-zinc-500"><span class="material-symbols-outlined" data-icon="more_vert">more_vert</span></button>
                        </div>
                        <div class="mx-4 relative aspect-video rounded-[20px] overflow-hidden">
                            <img class="w-full h-full object-cover brightness-75" src="${post.media_url || 'https://lh3.googleusercontent.com/aida-public/AB6AXuAL1xpKjmfS2V2zax9_z8WRftiT_sDCT1MgUq-PJTLrjyUpRzhzDWrogIqVnDS0IlaqA2ksXBaIKsGiZGImrMKVGGXzvVSCtCyLPCgU2-0CvyyfkbiDa-N0txnWk7cpD2XpGUFcfpp7llcuGCOorfZtG6l7yfoBt-XRGermx9cgRNFaozSvktc8Ot1-tSsVpEo2Xdl3lNjMtIfv9kiXrzoWzkEQzLxJThZKPt6St2HscazgujiFsTaCa3gzot6LcWURVU6MfK8OGn8r'}"/>
                            <div class="absolute inset-0 flex items-center justify-center">
                                <div class="w-16 h-16 bg-lime-400/20 backdrop-blur-md rounded-full flex items-center justify-center border border-lime-400/50 hover:scale-110 transition-transform cursor-pointer">
                                    <span class="material-symbols-outlined text-lime-400 text-4xl ml-1" data-weight="fill" style="font-variation-settings: 'FILL' 1;">play_arrow</span>
                                </div>
                            </div>
                            <div class="absolute bottom-4 left-4 right-4 h-1 bg-white/20 rounded-full">
                                <div class="w-1/3 h-full bg-lime-400 rounded-full kinetic-glow"></div>
                            </div>
                        </div>
                        <div class="p-container-padding space-y-3">
                            <p class="font-body-md text-body-md text-zinc-300 leading-relaxed">${post.description || ''}</p>
                            <div class="flex items-center justify-between pt-4">
                                <div class="flex items-center gap-6">
                                    <button class="flex items-center gap-2 group/btn ${post.is_liked ? 'text-red-500' : 'text-zinc-400'}" onclick="event.stopPropagation(); toggleLike(${post.id}, this)">
                                        <span class="material-symbols-outlined group-active/btn:scale-125 transition-transform" style="${post.is_liked ? "font-variation-settings: 'FILL' 1" : ""}">favorite</span>
                                        <span class="font-label-bold text-label-bold likes-count">${post.likes_count || 0}</span>
                                    </button>
                                    <button class="flex items-center gap-2 text-zinc-400" onclick="event.stopPropagation(); window.location.href='app-messages.html'"><span class="material-symbols-outlined">chat</span><span class="font-label-bold text-label-bold">${post.comments_count || 0}</span></button>
                                </div>
                            </div>
                        </div>
                    </article>`;
                } else {
                    return `
                    <article class="bg-zinc-900/60 rounded-[24px] overflow-hidden border border-white/5 shadow-2xl relative group">
                        <div class="p-container-padding flex items-center justify-between">
                            <div class="flex items-center gap-3">
                                <img class="w-10 h-10 rounded-full border border-lime-400" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAa2yTUoLjx-eIJTSin1a1GOyN1OgPlDwSUa1MS7_xvki2yYf7kTr_T3uuB_MhLXKTracrONJJ-CDoiwBR92qRE8oCVLxwmkwhweQpHRJ4Ib8wuvmJhW9TBic82Sb3aBE1Npa3qXfYe2_OmdJpanCFDm9Si9Dleu7XPqh_48bj8LGIA8UvdHibfPc7eJ8V1Vk-dfESooQNu3VYN7us6RT_aWTO1wCi3bYt8JwbhJF2Cv6iVyf-7Ur02zSWu2lyfTxpUrPhH5GH3zHD0"/>
                                <div>
                                    <h3 class="font-label-bold text-label-bold text-on-surface">${post.trainer_name || 'Coach'}</h3>
                                    <p class="font-label-sm text-label-sm text-zinc-500">Elite Tier • ${new Date(post.created_at).toLocaleDateString()}</p>
                                </div>
                            </div>
                            <button class="text-zinc-500"><span class="material-symbols-outlined">more_vert</span></button>
                        </div>
                        <div class="mx-4 relative aspect-[4/5] rounded-[20px] overflow-hidden">
                            <img class="w-full h-full object-cover" src="${post.media_url || 'https://lh3.googleusercontent.com/aida-public/AB6AXuBLROueBxPmAcdXUhD9cZrpBeyS08cmliZxuoQQ5QiqbWwaENcJxmCLabrPH3hhhFf3xwdsaxLCmShUtA_BCEOWsTt_Ra59rxT_m-HyeOJ6PDwGx9HRDjUl6sepC5lCe6g3quem2QO-Bt1t7wzMZCyKjiSyfO6XOOXHWlrtPlCrXBa5A9UtxvrdBZrRCSY-JwNcpz4P6lk4FvXXpQ2HD7qVquoIdMfDl1AhUy4jAqmNR4LtyTmPizLOXs-eODUh3vHXSr3v4aCTHPaL'}"/>
                            <div class="absolute top-4 right-4 bg-lime-400 text-black px-3 py-1 rounded-full font-label-bold text-[10px] uppercase tracking-widest kinetic-glow">${post.tags || 'Update'}</div>
                        </div>
                        <div class="p-container-padding space-y-3">
                            <p class="font-body-md text-body-md text-zinc-300 leading-relaxed">${post.description || ''}</p>
                            <div class="flex items-center justify-between pt-4">
                                <div class="flex items-center gap-6">
                                    <button class="flex items-center gap-2 group/btn ${post.is_liked ? 'text-red-500' : 'text-lime-400'}" onclick="toggleLike(${post.id}, this)">
                                        <span class="material-symbols-outlined group-active/btn:scale-125 transition-transform" style="${post.is_liked ? "font-variation-settings: 'FILL' 1" : "font-variation-settings: 'FILL' 1"}">favorite</span>
                                        <span class="font-label-bold text-label-bold likes-count">${post.likes_count || 0}</span>
                                    </button>
                                    <button class="flex items-center gap-2 text-zinc-400" onclick="window.location.href='app-messages.html'"><span class="material-symbols-outlined">chat</span><span class="font-label-bold text-label-bold">${post.comments_count || 0}</span></button>
                                </div>
                            </div>
                        </div>
                    </article>`;
                }
            }).join('');
        } catch (e) {
            console.error('Fetch post error', e);
        }
    }

    window.toggleLike = async function(postId, btnEl) {
        try {
            const res = await fetch('/api/posts_social?action=like', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                body: JSON.stringify({ post_id: postId })
            });
            if (res.ok) {
                const data = await res.json();
                const icon = btnEl.querySelector('.material-symbols-outlined');
                const countSpan = btnEl.querySelector('.likes-count');
                let count = parseInt(countSpan.innerText || "0");
                
                if (data.status === 'added') {
                    btnEl.classList.remove('text-lime-400', 'text-zinc-400');
                    btnEl.classList.add('text-red-500');
                    countSpan.innerText = count + 1;
                } else {
                    btnEl.classList.remove('text-red-500');
                    // Reset to default class based on its layout wrapper (lazy trick to just reset color)
                    btnEl.style.color = '';
                    if(!btnEl.className.includes('text-zinc-400')) btnEl.classList.add('text-zinc-400');
                    countSpan.innerText = count - 1;
                }
            }
        } catch (e) { console.error(e); }
    };
    document.addEventListener('DOMContentLoaded', fetchPosts);
</script>
</body></html>
