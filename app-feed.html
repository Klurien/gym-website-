<style>
.material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
body { min-height: max(884px, 100dvh); }
.kinetic-glow { box-shadow: 0px 10px 30px rgba(204, 255, 0, 0.15); }
.glass-card { background: rgba(26, 26, 26, 0.8); backdrop-filter: blur(12px); }
</style>
</head>
<body class="bg-background text-on-background min-h-screen pb-32">
<!-- TopAppBar -->
<header class="fixed top-0 left-0 right-0 z-50 flex justify-between items-center px-4 h-16 bg-zinc-900/80 backdrop-blur-xl rounded-2xl mt-4 mx-5 border border-white/10 shadow-[0px_10px_30px_rgba(204,255,0,0.15)]">
<div class="flex items-center gap-4">
<button class="p-2 text-zinc-500 hover:scale-105 active:scale-95 transition-all"><span class="material-symbols-outlined" data-icon="menu">menu</span></button>
<h1 class="text-xl font-black text-lime-400 font-lexend tracking-tighter uppercase">KINETIC</h1>
</div>
<div class="flex items-center gap-2">
<button class="p-2 text-zinc-500 hover:scale-105 active:scale-95 transition-all"><span class="material-symbols-outlined" data-icon="notifications">notifications</span></button>
<div class="w-10 h-10 rounded-full border-2 border-lime-400 p-0.5 overflow-hidden">
<img alt="User" class="w-full h-full object-cover rounded-full profile-pic" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAe2e9c3Yveyt8CGXNhLeNd-5GgPeKT87A-h3rsDcbvRHkLLkPUX0m7HXRCD1Py5clnNkTXK_yOegXbBxk8rjNEFAS_CqiK1Wtwa1XBi8lwOp6XMoHPudpC9qNf_d5kkCtexV7iilVEwa5dSonIHuUZ6_9FfeeTfH4AUIqADI2GfGqu4-X00YvBpE4HV0GHbHMwuQih5Ke8tmqYr8Gij2wYOz7TNo4EiHEZjl3hKVWAGa-BaEf1GYFlungW3LryWulRS2dLZBVHZSI_"/>
</div>
</div>
</header>
<main class="mt-28 px-edge-margin space-y-gutter max-w-2xl mx-auto">
<div class="grid grid-cols-4 gap-stack-md h-24 mb-stack-lg">
<div class="col-span-1 bg-zinc-900/40 rounded-2xl border border-white/5 flex flex-col items-center justify-center gap-1 hover:border-lime-400/50 transition-colors cursor-pointer" onclick="window.location.href='app-post.html'">
<div class="w-12 h-12 rounded-full border-2 border-dashed border-zinc-700 flex items-center justify-center"><span class="material-symbols-outlined text-zinc-400">add</span></div>
<span class="font-label-sm text-label-sm text-zinc-500">Post</span>
</div>
<div class="col-span-3 bg-zinc-900/40 rounded-2xl border border-white/5 overflow-hidden relative group cursor-pointer" onclick="window.location.href='app-live.html'">
<img class="absolute inset-0 w-full h-full object-cover opacity-40 group-hover:scale-110 transition-transform duration-700" src="https://images.unsplash.com/photo-1534438327276-14e5300c3a48?q=80&w=1470&auto=format&fit=crop"/>
<div class="absolute inset-0 bg-gradient-to-t from-black/80 to-transparent"></div>
<div class="absolute bottom-3 left-4">
<p class="font-label-bold text-label-bold text-lime-400">Live Workout</p>
<p class="font-label-sm text-label-sm text-white">Join Alex in 5 mins</p>
</div>
</div>
</div>

<div id="postsArea">
    <p class="text-zinc-500 text-center">Loading posts...</p>
</div>

</main>
<nav class="fixed bottom-0 left-0 right-0 z-50 flex justify-around items-center h-20 px-6 bg-zinc-900/90 backdrop-blur-2xl rounded-full mb-8 mx-10 border border-white/5 shadow-[0px_20px_50px_rgba(0,0,0,0.5)]">
<button class="bg-lime-400 text-black rounded-full p-3 shadow-[0_0_20px_rgba(204,255,0,0.6)] active:scale-90 duration-150 transition-all"><span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">home</span></button>
<button class="text-zinc-500 p-3 hover:text-lime-400 transition-colors active:scale-90 duration-150" onclick="window.location.href='app-messages.html'"><span class="material-symbols-outlined">chat</span></button>
<button class="text-zinc-500 p-3 hover:text-lime-400 transition-colors active:scale-90 duration-150" onclick="window.location.href='app-calendar.html'"><span class="material-symbols-outlined">event_note</span></button>
<button class="text-zinc-500 p-3 hover:text-lime-400 transition-colors active:scale-90 duration-150" onclick="window.location.href='app-tasks.html'"><span class="material-symbols-outlined">crisis_alert</span></button>
</nav>

<script>
    const token = localStorage.getItem('token');
    if (!token) window.location.href = 'login.html';
    const user = JSON.parse(localStorage.getItem('user') || '{}');
    if(user.profile_pic) document.querySelector('.profile-pic').src = user.profile_pic;

    async function fetchPosts() {
        try {
            const response = await fetch('/api/posts', {
                headers: { 'Authorization': 'Bearer ' + token }
            });
            const posts = await response.json();
            const container = document.getElementById('postsArea');
            if (!posts || posts.length === 0) {
                container.innerHTML = '<p class="text-zinc-500 text-center py-6">No posts available.</p>';
                return;
            }
            container.innerHTML = posts.map(post => `
<article class="bg-zinc-900/60 rounded-[24px] overflow-hidden border border-white/5 shadow-2xl relative group mb-8">
<div class="p-container-padding flex items-center justify-between">
<div class="flex items-center gap-3">
<div class="w-10 h-10 rounded-full border border-lime-400 bg-zinc-800 flex items-center justify-center font-bold text-lime-400 uppercase">${post.trainer_name?.charAt(0) || 'T'}</div>
<div>
<h3 class="font-label-bold text-label-bold text-on-surface">${post.trainer_name || 'Coach'}</h3>
<p class="font-label-sm text-label-sm text-zinc-500">${new Date(post.created_at).toLocaleDateString()}</p>
</div>
</div>
</div>
<div class="mx-4 relative ${post.type === 'live' ? 'aspect-video' : 'aspect-[4/5]'} rounded-[20px] overflow-hidden cursor-pointer" onclick="window.location.href='app-live.html?id=${post.id}'">
<img class="w-full h-full object-cover" src="${post.media_url || 'https://images.unsplash.com/photo-1534438327276-14e5300c3a48?q=80&w=1470&auto=format&fit=crop'}"/>
${post.type === 'live' ? `
<div class="absolute inset-0 flex items-center justify-center"><div class="w-16 h-16 bg-lime-400/20 backdrop-blur-md rounded-full flex items-center justify-center border border-lime-400/50 hover:scale-110 transition-transform"><span class="material-symbols-outlined text-lime-400 text-4xl ml-1" style="font-variation-settings: 'FILL' 1;">play_arrow</span></div></div>
<div class="absolute bottom-4 left-4 right-4 h-1 bg-white/20 rounded-full"><div class="w-1/3 h-full bg-lime-400 rounded-full kinetic-glow"></div></div>
` : `
<div class="absolute top-4 right-4 bg-lime-400 text-black px-3 py-1 rounded-full font-label-bold text-[10px] uppercase tracking-widest kinetic-glow">${post.tags || 'Update'}</div>
`}
</div>
<div class="p-container-padding space-y-3">
<h4 class="font-bold text-white text-lg">${post.title}</h4>
<p class="font-body-md text-body-md text-zinc-300 leading-relaxed">${post.description || ''}</p>
<div class="flex items-center justify-between pt-4">
<div class="flex items-center gap-6">
<button class="flex items-center gap-2 group/btn transition-colors ${post.is_liked ? 'text-red-500 hover:text-red-400' : 'text-lime-400 hover:text-lime-300'}" onclick="toggleLike(${post.id}, this)">
<span class="material-symbols-outlined group-active/btn:scale-125 transition-transform" style="${post.is_liked ? "font-variation-settings: 'FILL' 1" : ""}">favorite</span>
<span class="font-label-bold text-label-bold likes-count">${post.likes_count || 0}</span>
</button>
<button class="flex items-center gap-2 text-zinc-400 hover:text-lime-400 transition-colors" onclick="window.location.href='app-messages.html'">
<span class="material-symbols-outlined">chat</span>
<span class="font-label-bold text-label-bold">${post.comments_count || 0}</span>
</button>
<button class="flex items-center gap-2 text-zinc-400"><span class="material-symbols-outlined">share</span></button>
</div>
</div></div></article>`).join('');
        } catch (e) {
            document.getElementById('postsArea').innerHTML = '<p class="text-zinc-500 text-center py-6">Could not load posts.</p>';
        }
    }

    window.toggleLike = async function(postId, btnEl) {
        try {
            const res = await fetch('/api/posts_social?action=like', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                body: JSON.stringify({ post_id: postId })
            });
            if (res.ok) {
                const data = await res.json();
                const icon = btnEl.querySelector('.material-symbols-outlined');
                const countSpan = btnEl.querySelector('.likes-count');
                let count = parseInt(countSpan.innerText || "0");
                
                if (data.status === 'added') {
                    btnEl.classList.remove('text-lime-400');
                    btnEl.classList.add('text-red-500');
                    icon.style.fontVariationSettings = "'FILL' 1";
                    countSpan.innerText = count + 1;
                } else {
                    btnEl.classList.add('text-lime-400');
                    btnEl.classList.remove('text-red-500');
                    icon.style.fontVariationSettings = "'FILL' 0";
                    countSpan.innerText = count - 1;
                }
            }
        } catch (e) {
            console.error(e);
        }
    };

    document.addEventListener('DOMContentLoaded', fetchPosts);
</script>
</body>
</html>
