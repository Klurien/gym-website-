<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messages | Comrades Gym</title>
    <meta name="description" content="Stay connected with your trainer — in-app messaging for Comrades Gym members.">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&family=Syncopate:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* ── DESIGN TOKENS (from DESIGN.md) ─────────────────────────────────── */
        :root {
            --bg:          #0A0A0B;
            --bg-2:        #111114;
            --surface:     #18181C;
            --surface-2:   #1F1F25;
            --border:      rgba(255,255,255,0.08);
            --border-active: rgba(255,255,255,0.18);

            --red:         #E8294A;
            --red-soft:    rgba(232,41,74,0.12);
            --red-glow:    rgba(232,41,74,0.3);

            --amber:       #E8973A;
            --amber-soft:  rgba(232,151,58,0.12);

            --text:        #F2F2F3;
            --text-2:      #A0A0AB;
            --text-3:      #5C5C6B;

            --green:       #3ECF8E;
            --yellow:      #EAB308;

            --shadow-sm:   0 1px 3px rgba(0,0,0,0.4);
            --shadow-md:   0 4px 16px rgba(0,0,0,0.5);
            --shadow-lg:   0 8px 32px rgba(0,0,0,0.6);
            --shadow-red:  0 4px 20px rgba(232,41,74,0.25);

            --radius-xs:   4px;
            --radius-s:    8px;
            --radius-m:    12px;
            --radius-l:    16px;
            --radius-xl:   24px;
            --radius-full: 9999px;

            --nav-h:       68px;
            --sidebar-w:   320px;
        }

        /* ── RESET ───────────────────────────────────────────────────────────── */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* ── NAV ─────────────────────────────────────────────────────────────── */
        .nav {
            height: var(--nav-h);
            background: var(--bg-2);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            padding: 0 24px;
            gap: 16px;
            flex-shrink: 0;
            position: relative;
            z-index: 10;
        }
        .nav-logo {
            font-family: 'Anton', serif;
            font-size: 1.1rem;
            text-decoration: none;
            color: var(--text);
            letter-spacing: 1px;
        }
        .nav-logo span { color: var(--red); }
        .nav-divider {
            width: 1px; height: 20px;
            background: var(--border-active);
            margin: 0 4px;
        }
        .nav-title {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-2);
        }
        .nav-spacer { flex: 1; }
        .nav-btn {
            display: flex; align-items: center; gap: 8px;
            padding: 8px 16px;
            border-radius: var(--radius-s);
            font-size: 0.82rem; font-weight: 500;
            text-decoration: none;
            transition: all 0.2s ease;
            border: 1px solid var(--border);
            color: var(--text-2);
            background: transparent;
            cursor: pointer;
        }
        .nav-btn:hover { border-color: var(--border-active); color: var(--text); }
        .nav-btn.back { color: var(--text-2); }
        #navUnreadBadge {
            display: none;
            background: var(--red);
            color: #fff;
            font-size: 0.6rem; font-weight: 700;
            padding: 2px 6px;
            border-radius: var(--radius-full);
            line-height: 1.4;
        }

        /* ── LAYOUT ──────────────────────────────────────────────────────────── */
        .app {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* ── CONVERSATION SIDEBAR ────────────────────────────────────────────── */
        .sidebar {
            width: var(--sidebar-w);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            background: var(--bg-2);
            flex-shrink: 0;
        }
        .sidebar-header {
            padding: 20px 20px 16px;
            border-bottom: 1px solid var(--border);
        }
        .sidebar-title {
            font-size: 0.7rem;
            font-family: 'Syncopate', sans-serif;
            color: var(--text-3);
            letter-spacing: 0.1em;
            text-transform: uppercase;
            margin-bottom: 14px;
        }
        .search-wrap {
            position: relative;
        }
        .search-wrap i {
            position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
            color: var(--text-3); font-size: 0.85rem; pointer-events: none;
        }
        .search-input {
            width: 100%;
            padding: 9px 12px 9px 36px;
            background: var(--surface-2);
            border: 1px solid var(--border);
            border-radius: var(--radius-s);
            color: var(--text);
            font-size: 0.85rem;
            font-family: 'Inter', system-ui, sans-serif;
            outline: none;
            transition: border-color 0.2s;
        }
        .search-input:focus { border-color: var(--border-active); }
        .search-input::placeholder { color: var(--text-3); }

        .conv-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px 0;
        }
        .conv-list::-webkit-scrollbar { width: 4px; }
        .conv-list::-webkit-scrollbar-track { background: transparent; }
        .conv-list::-webkit-scrollbar-thumb { background: var(--border-active); border-radius: 2px; }

        .conv-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 20px;
            cursor: pointer;
            transition: background 0.15s ease;
            border-left: 3px solid transparent;
        }
        .conv-item:hover { background: var(--surface); }
        .conv-item.active {
            background: var(--surface);
            border-left-color: var(--red);
        }
        .conv-avatar {
            width: 44px; height: 44px;
            border-radius: var(--radius-full);
            background: var(--surface-2);
            border: 2px solid var(--border);
            display: flex; align-items: center; justify-content: center;
            font-size: 1rem; font-weight: 700;
            color: var(--text);
            flex-shrink: 0;
            position: relative;
            text-transform: uppercase;
        }
        .conv-avatar.trainer {
            border-color: var(--red);
            background: var(--red-soft);
            color: var(--red);
        }
        .unread-dot {
            position: absolute;
            top: -2px; right: -2px;
            width: 11px; height: 11px;
            background: var(--red);
            border-radius: var(--radius-full);
            border: 2px solid var(--bg-2);
        }
        .conv-meta { flex: 1; min-width: 0; }
        .conv-name {
            font-size: 0.9rem; font-weight: 600;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            margin-bottom: 3px;
            display: flex; align-items: center; gap: 6px;
        }
        .role-badge {
            font-size: 0.55rem; font-weight: 700;
            padding: 2px 6px;
            border-radius: var(--radius-full);
            text-transform: uppercase; letter-spacing: 0.06em;
            background: var(--red-soft); color: var(--red);
            flex-shrink: 0;
        }
        .role-badge.member {
            background: var(--amber-soft); color: var(--amber);
        }
        .conv-preview {
            font-size: 0.78rem; color: var(--text-2);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .conv-time {
            font-size: 0.7rem; color: var(--text-3);
            flex-shrink: 0; align-self: flex-start; padding-top: 2px;
        }
        .unread-count {
            background: var(--red);
            color: #fff;
            font-size: 0.65rem; font-weight: 700;
            width: 18px; height: 18px;
            border-radius: var(--radius-full);
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
        }
        .conv-empty {
            padding: 32px 20px;
            text-align: center;
            color: var(--text-3);
            font-size: 0.85rem;
        }
        .conv-empty i { font-size: 2rem; margin-bottom: 12px; display: block; opacity: 0.4; }

        /* Start new conversation (trainer list for members) */
        .new-conv-section {
            padding: 12px 20px;
            border-top: 1px solid var(--border);
        }
        .new-conv-label {
            font-size: 0.65rem;
            font-family: 'Syncopate', sans-serif;
            color: var(--text-3);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-bottom: 10px;
        }
        .trainer-pill {
            display: flex; align-items: center; gap: 10px;
            padding: 10px 12px;
            border-radius: var(--radius-s);
            cursor: pointer;
            background: var(--surface-2);
            border: 1px solid var(--border);
            margin-bottom: 6px;
            transition: border-color 0.2s;
        }
        .trainer-pill:hover { border-color: var(--red); }
        .trainer-pill-avatar {
            width: 30px; height: 30px;
            border-radius: var(--radius-full);
            background: var(--red-soft);
            color: var(--red);
            display: flex; align-items: center; justify-content: center;
            font-size: 0.8rem; font-weight: 700;
            text-transform: uppercase;
        }
        .trainer-pill-name { font-size: 0.85rem; font-weight: 500; }
        .trainer-pill-role { font-size: 0.7rem; color: var(--text-2); }

        /* ── CHAT THREAD ─────────────────────────────────────────────────────── */
        .thread {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Empty / placeholder state */
        .thread-empty {
            flex: 1;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            gap: 16px;
            color: var(--text-3);
        }
        .thread-empty i { font-size: 3rem; opacity: 0.25; }
        .thread-empty h3 { font-size: 1rem; color: var(--text-2); }
        .thread-empty p { font-size: 0.85rem; max-width: 280px; text-align: center; line-height: 1.6; }

        /* Thread header */
        .thread-header {
            display: none;
            align-items: center;
            gap: 14px;
            padding: 16px 24px;
            border-bottom: 1px solid var(--border);
            background: var(--bg-2);
            flex-shrink: 0;
        }
        .thread-header.visible { display: flex; }
        .thread-header-avatar {
            width: 40px; height: 40px;
            border-radius: var(--radius-full);
            background: var(--red-soft);
            color: var(--red);
            border: 2px solid var(--red);
            display: flex; align-items: center; justify-content: center;
            font-weight: 700; font-size: 0.95rem;
            text-transform: uppercase;
        }
        .thread-header-info h3 { font-size: 0.95rem; font-weight: 600; }
        .thread-header-info p { font-size: 0.75rem; color: var(--text-2); }
        .online-dot {
            width: 8px; height: 8px;
            background: var(--green);
            border-radius: var(--radius-full);
            display: inline-block;
            margin-right: 5px;
        }

        /* Messages scroll area */
        .messages-area {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .messages-area::-webkit-scrollbar { width: 4px; }
        .messages-area::-webkit-scrollbar-thumb { background: var(--border-active); border-radius: 2px; }

        .msg-row {
            display: flex;
            align-items: flex-end;
            gap: 8px;
        }
        .msg-row.out { flex-direction: row-reverse; }

        .msg-sender-avatar {
            width: 28px; height: 28px;
            border-radius: var(--radius-full);
            background: var(--surface-2);
            border: 1px solid var(--border);
            display: flex; align-items: center; justify-content: center;
            font-size: 0.65rem; font-weight: 700;
            flex-shrink: 0; text-transform: uppercase;
            color: var(--text-2);
        }
        .msg-row.out .msg-sender-avatar { background: var(--red-soft); color: var(--red); border-color: var(--red); }

        .bubble-wrap { display: flex; flex-direction: column; max-width: 68%; }
        .msg-row.out .bubble-wrap { align-items: flex-end; }

        .bubble {
            padding: 10px 14px;
            border-radius: var(--radius-l);
            font-size: 0.88rem;
            line-height: 1.55;
            word-break: break-word;
        }
        .bubble-in {
            background: var(--surface-2);
            color: var(--text);
            border-radius: var(--radius-l) var(--radius-l) var(--radius-l) var(--radius-xs);
        }
        .bubble-out {
            background: var(--red);
            color: #fff;
            border-radius: var(--radius-l) var(--radius-l) var(--radius-xs) var(--radius-l);
        }
        .bubble-time {
            font-size: 0.67rem;
            color: var(--text-3);
            margin-top: 4px;
            padding: 0 2px;
        }
        .msg-row.out .bubble-time { text-align: right; }

        /* Date divider */
        .date-divider {
            display: flex; align-items: center; gap: 12px;
            margin: 16px 0 10px;
            color: var(--text-3); font-size: 0.72rem;
        }
        .date-divider::before, .date-divider::after {
            content: ''; flex: 1; height: 1px; background: var(--border);
        }

        /* Typing indicator */
        .typing-indicator {
            display: none;
            align-items: center; gap: 8px;
            padding: 0 24px 12px;
            color: var(--text-3); font-size: 0.78rem;
        }
        .typing-dots span {
            display: inline-block;
            width: 5px; height: 5px;
            background: var(--text-3);
            border-radius: var(--radius-full);
            animation: typingBounce 1.2s infinite ease-in-out;
            margin-right: 2px;
        }
        .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
        .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes typingBounce {
            0%, 80%, 100% { transform: translateY(0); opacity: 0.4; }
            40% { transform: translateY(-5px); opacity: 1; }
        }

        /* Input bar */
        .input-bar {
            display: none;
            padding: 16px 24px;
            border-top: 1px solid var(--border);
            background: var(--bg-2);
            align-items: flex-end;
            gap: 12px;
        }
        .input-bar.visible { display: flex; }
        .input-wrap {
            flex: 1;
            background: var(--surface-2);
            border: 1px solid var(--border);
            border-radius: var(--radius-l);
            padding: 10px 16px;
            transition: border-color 0.2s;
            display: flex; align-items: flex-end; gap: 8px;
        }
        .input-wrap:focus-within { border-color: var(--border-active); }
        #msgInput {
            flex: 1;
            background: transparent;
            border: none; outline: none;
            color: var(--text);
            font-family: 'Inter', system-ui, sans-serif;
            font-size: 0.9rem;
            resize: none;
            max-height: 120px;
            line-height: 1.5;
        }
        #msgInput::placeholder { color: var(--text-3); }
        .send-btn {
            width: 40px; height: 40px;
            background: var(--red);
            border: none;
            border-radius: var(--radius-full);
            color: #fff;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            font-size: 0.95rem;
            flex-shrink: 0;
            transition: opacity 0.2s, transform 0.15s;
            box-shadow: var(--shadow-red);
        }
        .send-btn:hover { opacity: 0.88; transform: scale(1.06); }
        .send-btn:disabled { opacity: 0.35; cursor: not-allowed; transform: none; }

        /* Loading spinner */
        .spinner {
            width: 20px; height: 20px;
            border: 2px solid var(--border);
            border-top-color: var(--red);
            border-radius: var(--radius-full);
            animation: spin 0.7s linear infinite;
            margin: auto;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ── RESPONSIVE ──────────────────────────────────────────────────────── */
        @media (max-width: 768px) {
            :root { --sidebar-w: 100%; }
            .sidebar { position: absolute; z-index: 5; height: 100%; top: var(--nav-h); }
            .sidebar.hidden-mobile { display: none; }
            .thread { width: 100%; }
            #backToList { display: flex !important; }
        }
        #backToList { display: none; }
    </style>
</head>

<body>
    <!-- Navigation -->
    <nav class="nav">
        <a href="index.html" class="nav-logo"><span>COMRADES</span> GYM</a>
        <div class="nav-divider"></div>
        <span class="nav-title">Messages</span>
        <div class="nav-spacer"></div>
        <button id="backToList" class="nav-btn back" onclick="showSidebar()">
            <i class="fa-solid fa-arrow-left"></i> Back
        </button>
        <a href="dashboard.html" class="nav-btn">
            <i class="fa-solid fa-gauge-high"></i> Dashboard
        </a>
        <button id="logoutBtn" class="nav-btn">
            <i class="fa-solid fa-right-from-bracket"></i> Logout
        </button>
    </nav>

    <!-- App Layout -->
    <div class="app">
        <!-- Sidebar: Conversation List -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-title">Conversations</div>
                <div class="search-wrap">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" class="search-input" id="searchInput" placeholder="Search messages…">
                </div>
            </div>

            <div class="conv-list" id="convList">
                <div style="padding: 24px; text-align:center;">
                    <div class="spinner"></div>
                </div>
            </div>

            <!-- Trainers section (shown to members when they have no convos) -->
            <div class="new-conv-section" id="trainerSection" style="display:none;">
                <div class="new-conv-label">Start a conversation</div>
                <div id="trainerList"></div>
            </div>
        </aside>

        <!-- Chat Thread -->
        <main class="thread" id="thread">
            <div class="thread-empty" id="threadEmpty">
                <i class="fa-regular fa-comment-dots"></i>
                <h3>No conversation selected</h3>
                <p>Select a conversation from the list, or start one with your trainer.</p>
            </div>

            <div class="thread-header" id="threadHeader">
                <div class="thread-header-avatar" id="threadAvatar">—</div>
                <div class="thread-header-info">
                    <h3 id="threadName">—</h3>
                    <p id="threadStatus"><span class="online-dot"></span>Online</p>
                </div>
            </div>

            <div class="messages-area" id="messagesArea" style="display:none;"></div>

            <div class="typing-indicator" id="typingIndicator">
                <div class="typing-dots">
                    <span></span><span></span><span></span>
                </div>
                Trainer is typing…
            </div>

            <div class="input-bar" id="inputBar">
                <div class="input-wrap">
                    <textarea id="msgInput" rows="1" placeholder="Type a message…"></textarea>
                </div>
                <button class="send-btn" id="sendBtn" disabled>
                    <i class="fa-solid fa-paper-plane"></i>
                </button>
            </div>
        </main>
    </div>

    <script>
        // ── Auth ────────────────────────────────────────────────────────────────
        const token = localStorage.getItem('token');
        const user  = JSON.parse(localStorage.getItem('user') || 'null');
        if (!token || !user) { window.location.href = 'login.html'; }

        const isAdmin = user?.role === 'admin';
        let activeConvId = null;  // other user's id
        let activeConvName = '';
        let pollInterval  = null;
        let allConversations = [];

        // ── Helpers ─────────────────────────────────────────────────────────────
        function initials(name = '') {
            return name.split(' ').map(w => w[0]).join('').slice(0, 2).toUpperCase() || '?';
        }
        function formatTime(ts) {
            if (!ts) return '';
            const d = new Date(ts);
            const now = new Date();
            const diff = now - d;
            if (diff < 60000)       return 'Just now';
            if (diff < 3600000)     return `${Math.floor(diff/60000)}m ago`;
            if (diff < 86400000)    return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            return d.toLocaleDateString([], { month: 'short', day: 'numeric' });
        }
        function formatMsgTime(ts) {
            if (!ts) return '';
            return new Date(ts).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }
        function formatDate(ts) {
            const d = new Date(ts);
            const today = new Date();
            if (d.toDateString() === today.toDateString()) return 'Today';
            const yesterday = new Date(today);
            yesterday.setDate(today.getDate() - 1);
            if (d.toDateString() === yesterday.toDateString()) return 'Yesterday';
            return d.toLocaleDateString([], { weekday: 'long', month: 'long', day: 'numeric' });
        }

        // ── Fetch conversations ─────────────────────────────────────────────────
        async function loadConversations() {
            try {
                const res  = await fetch('/api/messages?action=conversations', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await res.json();
                allConversations = data.conversations || [];
                renderConversations(allConversations);

                // Show trainers section for members with no convos
                if (!isAdmin && data.availableTrainers?.length > 0 && allConversations.length === 0) {
                    renderTrainers(data.availableTrainers);
                }

                // Update nav unread badge
                const badge = document.getElementById('navUnreadBadge');
                if (data.total_unread > 0) {
                    badge.style.display = 'inline-block';
                    badge.textContent = data.total_unread > 9 ? '9+' : data.total_unread;
                } else {
                    badge.style.display = 'none';
                }
            } catch (e) {
                document.getElementById('convList').innerHTML =
                    `<div class="conv-empty"><i class="fa-solid fa-triangle-exclamation"></i>Failed to load conversations.</div>`;
            }
        }

        function renderConversations(convos) {
            const list = document.getElementById('convList');
            if (!convos.length) {
                list.innerHTML = `<div class="conv-empty">
                    <i class="fa-regular fa-comment-dots"></i>
                    No conversations yet. ${isAdmin ? 'Wait for members to message you.' : 'Start a conversation with your trainer below.'}
                </div>`;
                return;
            }
            list.innerHTML = convos.map(c => `
                <div class="conv-item ${activeConvId == c.other_id ? 'active' : ''}"
                     onclick="openConversation(${c.other_id}, '${c.other_name}', '${c.other_role}')">
                    <div class="conv-avatar ${c.other_role === 'admin' ? 'trainer' : ''}">
                        ${initials(c.other_name)}
                        ${c.unread > 0 ? '<div class="unread-dot"></div>' : ''}
                    </div>
                    <div class="conv-meta">
                        <div class="conv-name">
                            ${c.other_name}
                            <span class="role-badge ${c.other_role !== 'admin' ? 'member' : ''}">
                                ${c.other_role === 'admin' ? 'Trainer' : 'Member'}
                            </span>
                        </div>
                        <div class="conv-preview">${c.last_message || 'No messages yet'}</div>
                    </div>
                    <div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px;">
                        <div class="conv-time">${formatTime(c.last_at)}</div>
                        ${c.unread > 0 ? `<div class="unread-count">${c.unread > 9 ? '9+' : c.unread}</div>` : ''}
                    </div>
                </div>
            `).join('');
        }

        function renderTrainers(trainers) {
            document.getElementById('trainerSection').style.display = 'block';
            document.getElementById('trainerList').innerHTML = trainers.map(t => `
                <div class="trainer-pill" onclick="openConversation(${t.id}, '${t.username}', '${t.role}')">
                    <div class="trainer-pill-avatar">${initials(t.username)}</div>
                    <div>
                        <div class="trainer-pill-name">${t.username}</div>
                        <div class="trainer-pill-role">Personal Trainer</div>
                    </div>
                    <i class="fa-solid fa-chevron-right" style="margin-left:auto;color:var(--text-3);font-size:0.75rem;"></i>
                </div>
            `).join('');
        }

        // ── Open conversation thread ────────────────────────────────────────────
        async function openConversation(otherId, otherName, otherRole) {
            activeConvId   = otherId;
            activeConvName = otherName;

            // Mobile: hide sidebar
            hideSidebar();

            // Update header
            document.getElementById('threadAvatar').textContent = initials(otherName);
            document.getElementById('threadName').textContent   = otherName;
            document.getElementById('threadStatus').innerHTML   = otherRole === 'admin'
                ? `<span class="online-dot"></span>Trainer`
                : `<span class="online-dot"></span>Member`;
            document.getElementById('threadHeader').classList.add('visible');
            document.getElementById('inputBar').classList.add('visible');
            document.getElementById('threadEmpty').style.display = 'none';
            document.getElementById('messagesArea').style.display = 'flex';

            // Highlight active conv
            document.querySelectorAll('.conv-item').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.conv-item').forEach(el => {
                if (el.querySelector('.conv-name') &&
                    el.querySelector('.conv-name').textContent.trim().startsWith(otherName)) {
                    el.classList.add('active');
                }
            });

            // Enable send
            document.getElementById('sendBtn').disabled = false;

            await fetchThread();

            // Start polling
            if (pollInterval) clearInterval(pollInterval);
            pollInterval = setInterval(fetchThread, 3000);
        }

        // ── Fetch & render thread ──────────────────────────────────────────────
        async function fetchThread() {
            if (!activeConvId) return;
            try {
                const res  = await fetch(`/api/messages?with=${activeConvId}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await res.json();
                renderThread(data.messages || []);
                // Refresh conv list counts
                loadConversations();
            } catch (e) { /* silent poll failure */ }
        }

        function renderThread(messages) {
            const area = document.getElementById('messagesArea');
            if (!messages.length) {
                area.innerHTML = `<div style="text-align:center;color:var(--text-3);font-size:0.85rem;margin-top:24px;">
                    Send a message to start the conversation!</div>`;
                return;
            }

            let html = '';
            let lastDate = null;
            const myId = user.id;

            messages.forEach(m => {
                const msgDate = formatDate(m.created_at);
                if (msgDate !== lastDate) {
                    html += `<div class="date-divider">${msgDate}</div>`;
                    lastDate = msgDate;
                }
                const isOut = m.sender_id === myId;
                html += `
                    <div class="msg-row ${isOut ? 'out' : ''}">
                        <div class="msg-sender-avatar">${initials(m.sender_name)}</div>
                        <div class="bubble-wrap">
                            <div class="bubble ${isOut ? 'bubble-out' : 'bubble-in'}">${escapeHtml(m.content)}</div>
                            <div class="bubble-time">${formatMsgTime(m.created_at)}${isOut && m.is_read ? ' · Read' : ''}</div>
                        </div>
                    </div>
                `;
            });

            area.innerHTML = html;
            area.scrollTop = area.scrollHeight;
        }

        // ── Send message ───────────────────────────────────────────────────────
        async function sendMessage() {
            const input = document.getElementById('msgInput');
            const content = input.value.trim();
            if (!content || !activeConvId) return;

            const sendBtn = document.getElementById('sendBtn');
            sendBtn.disabled = true;

            try {
                const res = await fetch('/api/messages', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                    body: JSON.stringify({ receiver_id: activeConvId, content })
                });
                if (res.ok) {
                    input.value = '';
                    input.style.height = 'auto';
                    await fetchThread();
                } else {
                    const err = await res.json();
                    alert(err.error || 'Failed to send message.');
                }
            } catch (e) {
                alert('Network error. Please try again.');
            } finally {
                sendBtn.disabled = false;
                input.focus();
            }
        }

        // ── Search filter ─────────────────────────────────────────────────────
        document.getElementById('searchInput').addEventListener('input', (e) => {
            const q = e.target.value.toLowerCase();
            const filtered = allConversations.filter(c =>
                c.other_name.toLowerCase().includes(q) ||
                (c.last_message || '').toLowerCase().includes(q)
            );
            renderConversations(filtered);
        });

        // ── Input events ──────────────────────────────────────────────────────
        const msgInput = document.getElementById('msgInput');
        msgInput.addEventListener('input', () => {
            msgInput.style.height = 'auto';
            msgInput.style.height = Math.min(msgInput.scrollHeight, 120) + 'px';
            document.getElementById('sendBtn').disabled = !msgInput.value.trim() || !activeConvId;
        });
        msgInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
        });
        document.getElementById('sendBtn').addEventListener('click', sendMessage);

        // ── Logout ────────────────────────────────────────────────────────────
        document.getElementById('logoutBtn').addEventListener('click', () => {
            localStorage.clear(); window.location.href = 'login.html';
        });

        // ── Mobile helpers ────────────────────────────────────────────────────
        function hideSidebar() {
            if (window.innerWidth <= 768) {
                document.getElementById('sidebar').classList.add('hidden-mobile');
                document.getElementById('backToList').style.display = 'flex';
            }
        }
        function showSidebar() {
            document.getElementById('sidebar').classList.remove('hidden-mobile');
            document.getElementById('backToList').style.display = 'none';
        }

        // ── Security ──────────────────────────────────────────────────────────
        function escapeHtml(str) {
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        // ── Init ──────────────────────────────────────────────────────────────
        loadConversations();

        // Check for ?with= param to auto-open a conversation
        const urlParams = new URLSearchParams(window.location.search);
        const withParam = urlParams.get('with');
        const nameParam = urlParams.get('name') || 'Trainer';
        const roleParam = urlParams.get('role') || 'admin';
        if (withParam) {
            setTimeout(() => openConversation(parseInt(withParam), nameParam, roleParam), 500);
        }
    </script>
</body>
</html>
