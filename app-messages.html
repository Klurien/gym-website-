<!DOCTYPE html>

</head>
<body class="bg-background text-on-background font-body-md overflow-x-hidden">
<header class="fixed top-0 left-0 right-0 z-50 flex justify-between items-center px-4 h-16 bg-zinc-900/80 backdrop-blur-xl rounded-2xl mt-4 mx-5 border border-white/10 shadow-[0px_10px_30px_rgba(204,255,0,0.15)]">
<div class="flex items-center gap-4">
<button class="active:scale-95 transition-all hover:scale-105 transition-transform duration-200 text-lime-400">
<span class="material-symbols-outlined">menu</span>
</button>
<h1 class="font-lexend font-black tracking-tighter uppercase text-xl text-lime-400">KINETIC</h1>
</div>
<div class="flex items-center gap-4">
<button class="active:scale-95 transition-all hover:scale-105 transition-transform duration-200 text-zinc-500">
<span class="material-symbols-outlined">notifications</span>
</button>
<div class="w-8 h-8 rounded-full border border-lime-400/30 overflow-hidden active:scale-95 transition-all">
<img class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAnCpZEl4AeulSbxavyqWqu_VlfOo_tiKjR9m5iMaMHbAszJNRVLAS2Y02Zy4KkhBUYIbdcsyJXGrrVjoJVX5MJTZQ9y2c9LJbJ_wKNA_V4SzsKAf0oStaTMMfrG0rhZN29JOVWB4g9lRNLEr3yvp31ccJ2G-uE9vvce4MF7B9150ptHZyLXbVEs5djC7PQUvIjVgdnd1amBBfAVUbde1xi4xyqXATs9GVR6WgxzqBfIwLraUkr3VIRnZAvCauDijmNQ0dfbsJa-LY-"/>
</div>
</div>
</header>
<main class="pt-32 pb-32 px-edge-margin min-h-screen max-w-2xl mx-auto">
<section class="mb-stack-lg">
<h2 class="font-headline-lg text-headline-lg text-white mb-1">MESSAGES</h2>
<p class="font-label-sm text-label-sm text-zinc-500 tracking-widest uppercase">Direct line to performance</p>
</section>
<div class="mb-stack-lg relative">
<div class="absolute inset-y-0 left-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-zinc-500 text-sm">search</span>
</div>
<input class="w-full bg-zinc-900 border border-zinc-800 rounded-xl py-4 pl-12 pr-4 text-white focus:outline-none focus:border-lime-400 focus:ring-1 focus:ring-lime-400/20 transition-all font-body-md placeholder:text-zinc-600" placeholder="Search trainers or keywords..." type="text"/>
</div>
<div class="grid gap-gutter" id="convosList">
    <!-- Restoring exact static structure inside template later -->
</div>
<div class="mt-stack-lg">
<button class="w-full flex items-center justify-center gap-3 bg-zinc-950 border border-white/10 text-zinc-300 py-6 rounded-2xl active:scale-95 transition-all hover:bg-zinc-900">
<span class="material-symbols-outlined text-lime-400">add_comment</span>
<span class="font-label-bold text-label-bold uppercase tracking-widest">Start New Conversation</span>
</button>
</div>
</main>
<nav class="fixed bottom-0 left-0 right-0 z-50 flex justify-around items-center h-20 px-6 bg-zinc-900/90 backdrop-blur-2xl rounded-full mb-8 mx-10 border border-white/5 shadow-[0px_20px_50px_rgba(0,0,0,0.5)]">
<a class="text-zinc-500 p-3 hover:text-lime-400 transition-colors active:scale-90 duration-150" href="app-feed.html"><span class="material-symbols-outlined">home</span></a>
<a class="bg-lime-400 text-black rounded-full p-3 shadow-[0_0_20px_rgba(204,255,0,0.6)] active:scale-90 duration-150" href="app-messages.html"><span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">chat</span></a>
<a class="text-zinc-500 p-3 hover:text-lime-400 transition-colors active:scale-90 duration-150" href="app-calendar.html"><span class="material-symbols-outlined">event_note</span></a>
<a class="text-zinc-500 p-3 hover:text-lime-400 transition-colors active:scale-90 duration-150" href="app-tasks.html"><span class="material-symbols-outlined">crisis_alert</span></a>
</nav>

<script>
    const token = localStorage.getItem('token');
    if (!token) window.location.href = 'login.html';

    async function loadConversations() {
        try {
            const res = await fetch('/api/messages/conversations', {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            if (res.ok) {
                const convos = await res.json();
                renderConversations(convos);
            }
        } catch (err) { console.error(err); }
    }

    // Default Images Array matching prototype exactly
    const avatarFallback = [
        "https://lh3.googleusercontent.com/aida-public/AB6AXuDDIs7PF3VD8H7yVtsoGAK1m5rYn2-x0whFq3EuUer_doFz4l3G1WJ47IOshs1U2lThdFfJhxkiGCKdf83Wpqt-0RY7PEPQbqVftN5Hucy6agR6R9FbRy45XLG0m5Sp6e13rRx3loEgKOy2hV9epgfnivUryxmnfXU5qM0NAhPzc8Xu0W3Dn1GBhJ7SRkztSIdtDW4xmh09vjWA6rrYjE4log2PE8xJ03Ld33EM8HNAe-rMMHNaRUliTk7kAXcNtpKAnmKdeGXG-aut",
        "https://lh3.googleusercontent.com/aida-public/AB6AXuC2MgQnZJ4APLio92ylDFbhE8_Vx9p5TTAY0XXRzTf_piYQQm0yqjZiQZW8ZR_72G7gQDNf2t70w_f5AuN0DaPq5UnvbCLDSP4q2327mP1sOM07DapFStJloNNYlFXCfTg_jYAQE1_MdqujfufYGKEHImwbn8eE3P6K7e6u3VrHeFfDffnrROa5fXlEoeNbLEyGPFCZaGBb4Y3IJJUGXQRp-KZYK_URQ2qi0AsimiIWoUo1opuyRbuveg9FLH39FJ1KWIrwNjjPaESE",
        "https://lh3.googleusercontent.com/aida-public/AB6AXuCPuVfY_aJWupJQVFWWjNG-AegXHin7DMHwdyPRwx_3U8YHUKf_sSINcG4KkGZM5if63L8cPps4DH_VJzaWwv5e9Hn0QCDyz-3uI3ycChTSpUYSC0tPLWx6_ciWyv91bc3yLCHkJeIpWmu_1nddoofmUhK7J2lkVfibaDce0BJY34lqy6hcX295AClVHWbtBzyK1IUrAJjSQWeUkxEq1xUQ6NQSW5VvSUUMlXCi7KUsbLmPG9gi5XsjIchGxgej3u7sVpRGhI0_gxiT"
    ];

    function renderConversations(convos) {
        const container = document.getElementById('convosList');
        if (convos.length === 0) return;

        container.innerHTML = convos.map((c, i) => {
            const avatar = avatarFallback[i % 3];
            const isUnread = c.unread_count > 0;
            return `
            <div class="group relative ${isUnread ? 'bg-zinc-900/50' : 'bg-zinc-900/30'} backdrop-blur-md rounded-2xl p-container-padding border border-white/5 shadow-xl hover:border-lime-400/30 transition-all duration-300 active:scale-[0.98] cursor-pointer" onclick="window.location.href='messages.html?with=${c.other_user_id}'">
                <div class="flex gap-4">
                    <div class="relative flex-shrink-0">
                        <img class="w-14 h-14 rounded-2xl object-cover border border-white/10 ${isUnread ? '' : 'grayscale-[30%]'}" src="${avatar}"/>
                        ${isUnread ? '<div class="absolute -top-1 -right-1 w-4 h-4 bg-lime-400 rounded-full border-4 border-zinc-900 shadow-[0_0_10px_rgba(204,255,0,0.5)]"></div>' : ''}
                    </div>
                    <div class="flex-1 min-w-0">
                        <div class="flex justify-between items-start mb-1">
                            <h3 class="font-headline-md text-body-md font-bold text-white group-hover:text-lime-400 transition-colors">${c.other_user_name}</h3>
                            <span class="font-label-sm text-[10px] ${isUnread ? 'text-lime-400' : 'text-zinc-500'} uppercase tracking-tighter">${new Date(c.last_message_at).toLocaleDateString()}</span>
                        </div>
                        <p class="font-body-md text-sm ${isUnread ? 'text-zinc-300' : 'text-zinc-500'} line-clamp-1">${c.last_message_preview}</p>
                    </div>
                </div>
                ${isUnread ? `
                <div class="mt-4 flex gap-2">
                    <span class="px-3 py-1 bg-lime-400/10 border border-lime-400/20 rounded-full text-[10px] font-bold text-lime-400 uppercase tracking-widest">Training Plan</span>
                </div>` : ''}
            </div>`;
        }).join('');
    }

    document.addEventListener('DOMContentLoaded', loadConversations);
</script>
</body></html>
