<!DOCTYPE html>
<html class="dark" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<script id="tailwind-config">
tailwind.config={darkMode:"class",theme:{extend:{"colors":{"on-primary-fixed-variant":"#3c4d00","on-primary-fixed":"#161e00","outline":"#8e9379","on-tertiary-fixed":"#022100","on-surface":"#e5e2e1","on-error":"#690005","tertiary":"#ffffff","primary-fixed-dim":"#abd600","on-primary-container":"#556d00","tertiary-fixed":"#79ff5a","tertiary-container":"#79ff5a","surface-tint":"#abd600","surface-container":"#201f1f","on-surface-variant":"#c4c9ac","outline-variant":"#444933","on-secondary-fixed-variant":"#474746","secondary-fixed-dim":"#c8c6c5","secondary-container":"#474746","surface-variant":"#353534","on-tertiary-container":"#137500","on-tertiary-fixed-variant":"#0b5300","secondary":"#c8c6c5","on-secondary":"#313030","primary":"#ffffff","inverse-on-surface":"#313030","surface-container-highest":"#353534","on-background":"#e5e2e1","error":"#ffb4ab","error-container":"#93000a","primary-fixed":"#c3f400","on-secondary-fixed":"#1c1b1b","inverse-primary":"#506600","primary-container":"#c3f400","inverse-surface":"#e5e2e1","secondary-fixed":"#e5e2e1","surface-container-high":"#2a2a2a","surface":"#131313","on-error-container":"#ffdad6","tertiary-fixed-dim":"#2de500","on-tertiary":"#053900","on-primary":"#283500","background":"#131313","surface-container-lowest":"#0e0e0e","surface-dim":"#131313","surface-bright":"#3a3939","on-secondary-container":"#b7b5b4","surface-container-low":"#1c1b1b"},"spacing":{"stack-md":"16px","gutter":"16px","edge-margin":"20px","unit":"4px","container-padding":"24px","stack-lg":"32px","stack-sm":"8px"},"fontFamily":{"label-sm":["Lexend"],"headline-md":["Lexend"],"headline-lg":["Lexend"],"body-md":["Lexend"],"label-bold":["Lexend"],"display-xl":["Lexend"],"body-lg":["Lexend"]}}}}
</script>
<style>
body { background-color: #131313; min-height: max(884px, 100dvh); overflow-x-hidden; }
.material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
.no-scrollbar::-webkit-scrollbar { display: none; }
.no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
</style>
</head>
<body class="bg-background text-on-background font-body-md overflow-x-hidden pb-32">
<header class="fixed top-0 left-0 right-0 z-50 flex justify-between items-center px-4 h-16 bg-zinc-900/80 backdrop-blur-xl rounded-2xl mt-4 mx-5 border border-white/10 shadow-[0px_10px_30px_rgba(204,255,0,0.15)]">
<div class="flex items-center gap-4">
<button class="active:scale-95 transition-all hover:scale-105 transition-transform duration-200 text-lime-400"><span class="material-symbols-outlined">menu</span></button>
<h1 class="font-lexend font-black tracking-tighter uppercase text-xl text-lime-400">KINETIC</h1>
</div>
<div class="flex items-center gap-4">
<button class="text-zinc-500"><span class="material-symbols-outlined">notifications</span></button>
<div class="w-8 h-8 rounded-full border border-lime-400/30 overflow-hidden profile-pic-container">
<img class="w-full h-full object-cover profile-pic" src="https://images.unsplash.com/photo-1534438327276-14e5300c3a48?auto=format&fit=crop&w=400"/>
</div>
</div>
</header>
<main class="pt-32 pb-32 px-edge-margin min-h-screen max-w-2xl mx-auto">
<section class="mb-stack-lg">
<h2 class="font-headline-lg text-headline-lg text-white mb-1">MESSAGES</h2>
<p class="font-label-sm text-label-sm text-zinc-500 tracking-widest uppercase">Direct line to performance</p>
</section>
<div class="mb-stack-lg relative">
<div class="absolute inset-y-0 left-4 flex items-center pointer-events-none"><span class="material-symbols-outlined text-zinc-500">search</span></div>
<input class="w-full bg-zinc-900 border border-zinc-800 rounded-xl py-4 pl-12 pr-4 text-white focus:ring-1 focus:ring-lime-400/20 font-body-md" placeholder="Search trainers..." type="text"/>
</div>
<div class="grid gap-gutter" id="convosList">
    <p class="text-zinc-500 text-center py-6">Loading conversations...</p>
</div>
<div class="mt-stack-lg">
<button class="w-full flex items-center justify-center gap-3 bg-zinc-950 border border-white/10 text-zinc-300 py-6 rounded-2xl active:scale-95 transition-all hover:bg-zinc-900">
<span class="material-symbols-outlined text-lime-400">add_comment</span>
<span class="font-label-bold text-label-bold uppercase tracking-widest">Start New Conversation</span>
</button>
</div>
</main>
<nav class="fixed bottom-0 left-0 right-0 z-50 flex justify-around items-center h-20 px-6 bg-zinc-900/90 backdrop-blur-2xl rounded-full mb-8 mx-10 border border-white/5 shadow-[0px_20px_50px_rgba(0,0,0,0.5)]">
<button class="text-zinc-500 p-3 hover:text-lime-400 transition-colors active:scale-90" onclick="window.location.href='app-feed.html'"><span class="material-symbols-outlined">home</span></button>
<button class="bg-lime-400 text-black rounded-full p-3 shadow-[0_0_20px_rgba(204,255,0,0.6)] active:scale-90"><span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">chat</span></button>
<button class="text-zinc-500 p-3 hover:text-lime-400 transition-colors active:scale-90" onclick="window.location.href='app-calendar.html'"><span class="material-symbols-outlined">event_note</span></button>
<button class="text-zinc-500 p-3 hover:text-lime-400 transition-colors active:scale-90" onclick="window.location.href='app-tasks.html'"><span class="material-symbols-outlined">crisis_alert</span></button>
</nav>
<script>
    const token = localStorage.getItem('token');
    const user = JSON.parse(localStorage.getItem('user') || '{}');
    if (!token) window.location.href = 'login.html';
    if(user.profile_pic) document.querySelector('.profile-pic').src = user.profile_pic;

    async function loadConversations() {
        try {
            const res = await fetch('/api/messages/conversations', {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            if (res.ok) {
                const convos = await res.json();
                renderConversations(convos);
            } else {
                document.getElementById('convosList').innerHTML = '<p class="text-center text-zinc-500 py-6">Failed to load messages.</p>';
            }
        } catch (err) {
            document.getElementById('convosList').innerHTML = '<p class="text-center text-zinc-500 py-6">Network error.</p>';
        }
    }

    function renderConversations(convos) {
        const container = document.getElementById('convosList');
        if (convos.length === 0) {
            container.innerHTML = '<p class="text-zinc-500 text-center py-6">No recent conversations.</p>';
            return;
        }

        container.innerHTML = convos.map(c => `
        <div class="group relative bg-zinc-900/50 backdrop-blur-md rounded-2xl p-container-padding border border-white/5 shadow-xl hover:border-lime-400/30 transition-all duration-300 active:scale-[0.98] cursor-pointer" onclick="window.location.href='messages.html?with=${c.other_user_id}'">
            <div class="flex gap-4">
                <div class="relative flex-shrink-0">
                    <div class="w-14 h-14 rounded-2xl border border-white/10 bg-zinc-800 flex items-center justify-center font-bold text-lg text-lime-400">
                        ${c.other_user_name[0].toUpperCase()}
                    </div>
                    ${c.unread_count > 0 ? '<div class="absolute -top-1 -right-1 w-4 h-4 bg-lime-400 rounded-full border-4 border-zinc-900 shadow-[0_0_10px_rgba(204,255,0,0.5)]"></div>' : ''}
                </div>
                <div class="flex-1 min-w-0">
                    <div class="flex justify-between items-start mb-1">
                        <h3 class="font-headline-md text-body-md font-bold ${c.unread_count > 0 ? 'text-lime-400' : 'text-white'} group-hover:text-lime-400 transition-colors">${c.other_user_name}</h3>
                        <span class="font-label-sm text-[10px] text-zinc-500 uppercase tracking-tighter">${new Date(c.last_message_at).toLocaleDateString()}</span>
                    </div>
                    <p class="font-body-md text-sm text-zinc-300 line-clamp-1">${c.last_message_preview}</p>
                </div>
            </div>
            <div class="mt-4 flex gap-2">
                <span class="px-3 py-1 bg-lime-400/10 border border-lime-400/20 rounded-full text-[10px] font-bold text-lime-400 uppercase tracking-widest">Chat</span>
            </div>
        </div>
        `).join('');
    }

    document.addEventListener('DOMContentLoaded', loadConversations);
</script>
</body>
</html>
