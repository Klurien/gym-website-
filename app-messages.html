<!DOCTYPE html>
<html class="dark" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Kinetic Messages</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<style>
    body { background-color: #131313; margin: 0; padding: 0; -webkit-font-smoothing: antialiased; font-family: 'Lexend', sans-serif;}
    .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
</style>
<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: { extend: {} }
    }
</script>
</head>
<body class="bg-[#131313] text-[#e5e2e1] overflow-x-hidden min-h-screen">
<header class="fixed top-0 left-0 right-0 z-50 flex justify-between items-center px-4 h-16 bg-zinc-900/80 backdrop-blur-xl rounded-2xl mt-4 mx-5 border border-white/10 shadow-[0px_10px_30px_rgba(204,255,0,0.15)]">
<div class="flex items-center gap-4">
<button class="active:scale-95 transition-all hover:scale-105 transition-transform duration-200">
<span class="material-symbols-outlined text-lime-400">menu</span>
</button>
<h1 class="font-lexend font-black tracking-tighter uppercase text-xl text-lime-400">KINETIC</h1>
</div>
<div class="flex items-center gap-4">
<button class="active:scale-95 transition-all hover:scale-105 transition-transform duration-200">
<span class="material-symbols-outlined text-zinc-500">notifications</span>
</button>
<div class="w-8 h-8 rounded-full border border-lime-400/30 overflow-hidden active:scale-95 transition-all">
<img alt="Profile" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAnCpZEl4AeulSbxavyqWqu_VlfOo_tiKjR9m5iMaMHbAszJNRVLAS2Y02Zy4KkhBUYIbdcsyJXGrrVjoJVX5MJTZQ9y2c9LJbJ_wKNA_V4SzsKAf0oStaTMMfrG0rhZN29JOVWB4g9lRNLEr3yvp31ccJ2G-uE9vvce4MF7B9150ptHZyLXbVEs5djC7PQUvIjVgdnd1amBBfAVUbde1xi4xyqXATs9GVR6WgxzqBfIwLraUkr3VIRnZAvCauDijmNQ0dfbsJa-LY-"/>
</div>
</div>
</header>
<main class="pt-32 pb-32 px-5 min-h-screen max-w-2xl mx-auto">
<section class="mb-8">
<h2 class="text-3xl font-bold text-white mb-1">MESSAGES</h2>
<p class="text-xs text-zinc-500 tracking-widest uppercase">Direct line to performance</p>
</section>
<div class="mb-8 relative">
<div class="absolute inset-y-0 left-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-zinc-500 text-sm">search</span>
</div>
<input class="w-full bg-zinc-900 border border-zinc-800 rounded-xl py-4 pl-12 pr-4 text-white focus:outline-none focus:border-lime-400 focus:ring-1 focus:ring-lime-400/20 transition-all placeholder:text-zinc-600" placeholder="Search trainers or keywords..." type="text"/>
</div>
<div class="grid gap-4" id="convosList">
    <p class="text-zinc-500 py-6 text-center">Loading conversations...</p>
</div>
<div class="mt-8">
<button class="w-full flex items-center justify-center gap-3 bg-zinc-950 border border-white/10 text-zinc-300 py-6 rounded-2xl active:scale-95 transition-all hover:bg-zinc-900">
<span class="material-symbols-outlined text-lime-400">add_comment</span>
<span class="text-sm font-bold uppercase tracking-widest">Start New Conversation</span>
</button>
</div>
</main>
<nav class="fixed bottom-0 left-0 right-0 z-50 flex justify-around items-center h-20 px-6 bg-zinc-900/90 backdrop-blur-2xl rounded-full mb-8 mx-10 border border-white/5 shadow-[0px_20px_50px_rgba(0,0,0,0.5)]">
<a class="text-zinc-500 p-3 hover:text-lime-400 transition-colors active:scale-90 duration-150" href="app-feed.html">
<span class="material-symbols-outlined">home</span></a>
<a class="bg-lime-400 text-black rounded-full p-3 shadow-[0_0_20px_rgba(204,255,0,0.6)] active:scale-90 duration-150" href="#">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">chat</span></a>
<a class="text-zinc-500 p-3 hover:text-lime-400 transition-colors active:scale-90 duration-150" href="app-calendar.html">
<span class="material-symbols-outlined">event_note</span></a>
<a class="text-zinc-500 p-3 hover:text-lime-400 transition-colors active:scale-90 duration-150" href="app-tasks.html">
<span class="material-symbols-outlined">assignment</span></a>
</nav>
</nav>
<script>
    const token = localStorage.getItem('token');
    if (!token) {
        window.location.href = 'login.html';
    }

    async function loadConversations() {
        try {
            const res = await fetch('/api/messages/conversations', {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            if (res.ok) {
                const convos = await res.json();
                renderConversations(convos);
            } else {
                document.getElementById('convosList').innerHTML = '<p class="text-center text-zinc-500 py-6">Failed to load messages.</p>';
            }
        } catch (err) {
            document.getElementById('convosList').innerHTML = '<p class="text-center text-zinc-500 py-6">Network error.</p>';
        }
    }

    function renderConversations(convos) {
        const container = document.getElementById('convosList');
        if (convos.length === 0) {
            container.innerHTML = '<p class="text-zinc-500 text-center py-6">No recent conversations.</p>';
            return;
        }

        container.innerHTML = convos.map(c => `
        <div class="group relative bg-zinc-900/50 backdrop-blur-md rounded-2xl p-6 border border-white/5 shadow-xl hover:border-lime-400/30 transition-all duration-300 cursor-pointer active:scale-[0.98]" onclick="window.location.href='messages.html?with=${c.other_user_id}'">
            <div class="flex gap-4">
                <div class="relative flex-shrink-0">
                    <div class="w-14 h-14 rounded-2xl object-cover border border-white/10 bg-zinc-800 flex items-center justify-center font-bold text-lg text-lime-400">
                        ${c.other_user_name[0].toUpperCase()}
                    </div>
                    ${c.unread_count > 0 ? '<div class="absolute -top-1 -right-1 w-4 h-4 bg-lime-400 rounded-full border-4 border-zinc-900 shadow-[0_0_10px_rgba(204,255,0,0.5)]"></div>' : ''}
                </div>
                <div class="flex-1 min-w-0">
                    <div class="flex justify-between items-start mb-1">
                        <h3 class="text-sm font-bold ${c.unread_count > 0 ? 'text-lime-400' : 'text-white'} group-hover:text-lime-400 transition-colors">${c.other_user_name}</h3>
                        <span class="text-[10px] text-zinc-500 uppercase tracking-tighter">${new Date(c.last_message_at).toLocaleDateString()}</span>
                    </div>
                    <p class="text-sm text-zinc-300 line-clamp-1">${c.last_message_preview}</p>
                </div>
            </div>
        </div>
        `).join('');
    }

    document.addEventListener('DOMContentLoaded', loadConversations);
</script>
</body></html>
