<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Command | COMRADES GYM</title>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600;800&family=Syncopate:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .admin-grid {
            padding-top: 15rem;
            padding-bottom: 10rem;
        }
        .data-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0 1rem;
        }
        .data-table th {
            text-align: left;
            padding: 1.5rem;
            font-family: var(--font-accent);
            font-size: 0.7rem;
            color: var(--color-red);
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        .data-row {
            background: var(--color-surface);
            backdrop-filter: var(--glass);
            border: 1px solid var(--color-border);
            transition: var(--transition-fast);
        }
        .data-row:hover {
            background: var(--color-surface-hover);
            transform: scale(1.01);
        }
        .data-cell {
            padding: 2rem 1.5rem;
            font-size: 0.9rem;
        }
        .status-badge {
            padding: 0.4rem 1rem;
            border-radius: 20px;
            font-size: 0.6rem;
            font-weight: 800;
            text-transform: uppercase;
            background: rgba(255, 0, 60, 0.1);
            color: var(--color-red);
            border: 1px solid var(--color-red);
        }
        .dashboard-widgets {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 2rem;
            margin-bottom: 4rem;
        }
        .widget-card {
            background: var(--color-surface);
            backdrop-filter: var(--glass);
            border: 1px solid var(--color-border);
            padding: 2rem;
            border-radius: var(--radius-m);
        }
        @media (max-width: 1024px) {
            .dashboard-widgets { grid-template-columns: 1fr; }
        }
    </style>
</head>

<body class="subpage">
    <nav class="navbar scrolled">
        <div class="nav-container">
            <a href="/" class="logo"><span class="logo-red">COMRADES</span> COMMAND</a>
            <div class="nav-links">
                <a href="#" id="logoutBtn" class="btn-secondary" style="padding: 0.6rem 1.4rem; font-size: 0.7rem;">TERMINATE SESSION</a>
            </div>
        </div>
    </nav>

    <div class="container admin-grid">
        <div class="section-badge">ADMINISTRATION INTERFACE</div>
        <h1 class="section-title">COMMAND <span class="logo-red">CENTER.</span></h1>
        
        <div id="loading" class="logo-red" style="margin-top: 2rem;">INITIALIZING SECURE LINK...</div>

        <!-- Dashboard Widgets -->
        <div class="dashboard-widgets" id="dashboardWidgets" style="display: none;">
            
            <!-- Analytics Chart -->
            <div class="widget-card">
                <h3 style="margin-bottom: 1.5rem; font-family: var(--font-accent); color: var(--color-red);">SYSTEM ANALYTICS</h3>
                <div class="stats-grid" style="margin-bottom: 2rem; padding: 0; background: transparent; border: none; grid-template-columns: repeat(3, 1fr);">
                    <div><h2 id="statUsers" style="font-size: 3rem;">-</h2><p style="font-size: 0.8rem; color: var(--color-text-muted);">ACTIVE RECRUITS</p></div>
                    <div><h2 id="statBookings" style="font-size: 3rem;">-</h2><p style="font-size: 0.8rem; color: var(--color-text-muted);">TOTAL BOOKINGS</p></div>
                    <div><h2 id="statInquiries" style="font-size: 3rem;">-</h2><p style="font-size: 0.8rem; color: var(--color-text-muted);">NEW INTEL</p></div>
                </div>
                <canvas id="analyticsChart" style="width: 100%; height: 250px;"></canvas>
            </div>

            <!-- Class Management -->
            <div class="widget-card">
                <h3 style="margin-bottom: 1.5rem; font-family: var(--font-accent); color: var(--color-red);">CLASS DIRECTIVE</h3>
                <form id="createClassForm" style="display: grid; gap: 1rem;">
                    <input type="text" name="name" placeholder="CLASS NAME" required style="width: 100%; padding: 0.8rem; background: rgba(255,255,255,0.05); border: 1px solid var(--color-border); color: #fff;">
                    <input type="text" name="instructor" placeholder="INSTRUCTOR" required style="width: 100%; padding: 0.8rem; background: rgba(255,255,255,0.05); border: 1px solid var(--color-border); color: #fff;">
                    <input type="datetime-local" name="time" required style="width: 100%; padding: 0.8rem; background: rgba(255,255,255,0.05); border: 1px solid var(--color-border); color: #fff;">
                    <input type="text" name="location" placeholder="LOCATION (e.g. MAIN HALL)" required style="width: 100%; padding: 0.8rem; background: rgba(255,255,255,0.05); border: 1px solid var(--color-border); color: #fff;">
                    <button type="submit" class="btn-primary" style="width: 100%; padding: 0.8rem; font-size: 0.8rem;">INITIATE CLASS</button>
                    <p id="classMsg" style="font-size: 0.8rem; color: var(--color-red); margin-top: 0.5rem;"></p>
                </form>
            </div>

            <!-- Kinetic Feed Posting -->
            <div class="widget-card">
                <h3 style="margin-bottom: 1.5rem; font-family: var(--font-accent); color: var(--color-red);">KINETIC LIVE POST</h3>
                <form id="createPostForm" style="display: grid; gap: 1rem;">
                    <input type="text" name="title" placeholder="POST TITLE" required style="width: 100%; padding: 0.8rem; background: rgba(255,255,255,0.05); border: 1px solid var(--color-border); color: #fff;">
                    <textarea name="description" placeholder="POST DESCRIPTION" style="width: 100%; padding: 0.8rem; background: rgba(255,255,255,0.05); border: 1px solid var(--color-border); color: #fff; min-height: 50px;"></textarea>
                    <input type="text" name="media_url" placeholder="MEDIA URL" required style="width: 100%; padding: 0.8rem; background: rgba(255,255,255,0.05); border: 1px solid var(--color-border); color: #fff;">
                    <select name="type" style="width: 100%; padding: 0.8rem; background: rgba(255,255,255,0.05); border: 1px solid var(--color-border); color: #fff;">
                        <option value="static" style="color: #000">Static Post</option>
                        <option value="live" style="color: #000">Live Session</option>
                    </select>
                    <input type="text" name="tags" placeholder="TAGS" style="width: 100%; padding: 0.8rem; background: rgba(255,255,255,0.05); border: 1px solid var(--color-border); color: #fff;">
                    <button type="submit" class="btn-primary" style="width: 100%; padding: 0.8rem; font-size: 0.8rem;">PUBLISH</button>
                    <p id="postMsg" style="font-size: 0.8rem; color: var(--color-red); margin-top: 0.5rem;"></p>
                </form>
            </div>
        </div>

        <h3 style="margin-top: 3rem; margin-bottom: 2rem; font-family: var(--font-accent);">INQUIRY INTEL</h3>
        <table class="data-table">
            <thead>
                <tr>
                    <th>RECRUIT</th>
                    <th>CONTACT INTEL</th>
                    <th>BATTLE INTEREST</th>
                    <th>MESSAGE</th>
                    <th>ACTIONS</th>
                </tr>
            </thead>
            <tbody id="responsesContainer">
                <!-- Data will be injected here -->
            </tbody>
        </table>
    </div>

    <script>
        const token = localStorage.getItem('token');
        const user = JSON.parse(localStorage.getItem('user'));
        
        if (!token || !user || user.role !== 'admin') {
            window.location.href = '/auth';
        }

        async function fetchAnalytics() {
            try {
                const res = await fetch('/api/analytics', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (res.ok) {
                    const data = await res.json();
                    document.getElementById('statUsers').innerText = data.stats.total_users;
                    document.getElementById('statBookings').innerText = data.stats.total_bookings;
                    document.getElementById('statInquiries').innerText = data.stats.total_inquiries;

                    // Init Chart.js
                    const ctx = document.getElementById('analyticsChart').getContext('2d');
                    new Chart(ctx, {
                        type: 'line',
                        data: {
                            labels: ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'],
                            datasets: [{
                                label: 'Activity Index',
                                data: [12, 19, 3, 5, 2, 3, 15], // Mock trend data
                                borderColor: '#FF003C',
                                backgroundColor: 'rgba(255, 0, 60, 0.1)',
                                tension: 0.4,
                                fill: true,
                                pointBackgroundColor: '#FF003C'
                            }]
                        },
                        options: {
                            responsive: true,
                            plugins: { legend: { display: false } },
                            scales: {
                                y: { beginAtZero: true, grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#888' } },
                                x: { grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#888' } }
                            }
                        }
                    });
                }
            } catch (err) {
                console.error("Analytics fetch failed", err);
            }
        }

        async function fetchResponses() {
            try {
                const res = await fetch('/api/admin/responses', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const result = await res.json();
                
                document.getElementById('loading').style.display = 'none';
                document.getElementById('dashboardWidgets').style.display = 'grid';
                
                if (res.ok) {
                    const container = document.getElementById('responsesContainer');
                    if (result.responses.length === 0) {
                        container.innerHTML = "<tr><td colspan='5' class='data-cell'>NO ACTIVE LEADS FOUND.</td></tr>";
                        return;
                    }
                    
                    container.innerHTML = result.responses.map(resp => `
                        <tr class="data-row">
                            <td class="data-cell">
                                <div style="font-weight: 800; color: #fff;">${resp.name.toUpperCase()}</div>
                                <div style="font-size: 0.7rem; color: var(--color-text-muted);">${new Date(resp.created_at).toLocaleDateString()}</div>
                            </td>
                            <td class="data-cell">
                                <div style="font-size: 0.8rem;">${resp.email}</div>
                                <div style="font-size: 0.8rem; color: var(--color-text-muted);">${resp.phone}</div>
                            </td>
                            <td class="data-cell">
                                <span class="status-badge">${resp.interests}</span>
                            </td>
                            <td class="data-cell" style="max-width: 300px; font-size: 0.8rem; color: var(--color-text-muted);">
                                ${resp.message}
                            </td>
                            <td class="data-cell">
                                <a href="mailto:${resp.email}" class="btn-primary" style="padding: 0.6rem 1.2rem; font-size: 0.6rem;">RESPOND</a>
                            </td>
                        </tr>
                    `).join('');
                } else {
                    document.getElementById('loading').innerHTML = result.error;
                }
            } catch (err) {
                document.getElementById('loading').innerHTML = "COMMUNICATION FAILURE.";
            }
        }

        document.getElementById('createClassForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            const data = Object.fromEntries(formData);
            // Format datetime output for MySQL compatibility
            data.time = data.time.replace('T', ' ') + ':00';
            
            try {
                const res = await fetch('/api/classes', {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}` 
                    },
                    body: JSON.stringify(data)
                });
                if (res.ok) {
                    document.getElementById('classMsg').innerText = "CLASS INITIATED SUCCESSFULLY.";
                    document.getElementById('classMsg').style.color = "#4ade80";
                    e.target.reset();
                } else {
                    document.getElementById('classMsg').innerText = "FAILED TO INITIATE CLASS.";
                    document.getElementById('classMsg').style.color = "var(--color-red)";
                }
            } catch (err) {
                document.getElementById('classMsg').innerText = "NETWORK ERROR.";
            }
        });

        document.getElementById('createPostForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            const data = Object.fromEntries(formData);
            
            try {
                const res = await fetch('/api/posts', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                    body: JSON.stringify(data)
                });
                if (res.ok) {
                    document.getElementById('postMsg').innerText = "POST PUBLISHED SUCCESSFULLY.";
                    document.getElementById('postMsg').style.color = "#4ade80";
                    e.target.reset();
                } else {
                    document.getElementById('postMsg').innerText = "FAILED TO PUBLISH POST.";
                    document.getElementById('postMsg').style.color = "var(--color-red)";
                }
            } catch (err) {
                document.getElementById('postMsg').innerText = "NETWORK ERROR.";
            }
        });

        document.getElementById('logoutBtn').addEventListener('click', (e) => {
            e.preventDefault();
            localStorage.clear();
            window.location.href = '/auth';
        });

        // Initialize dashboard
        fetchAnalytics();
        fetchResponses();
    </script>
</body>
</html>
